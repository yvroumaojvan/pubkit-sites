<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04070b">
<meta name="description" content="林间小屋 · 雾里灯 —— 可自由行走、推门而入的三维林间木屋">
<title>林间小屋 · 雾里灯 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M20.7 14.6A9 9 0 1 1 9.9 3.3a7 7 0 0 0 10.8 11.3Z' fill='none' stroke='%23ffd39a' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ══════════════════════════════════════════════════════════════
   林间小屋 · 雾里灯（3D）
   所有图标为手写 SVG 路径；所有场景元素由代码生成。
   ══════════════════════════════════════════════════════════════ */
*, *::before, *::after{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root{
  --bg:#04070b;
  --paper:#e9dcc4;
  --paper-dim:rgba(233,220,196,.58);
  --warm:#ffd39a;
  --warm-deep:#e9a95c;
  --line:rgba(233,220,196,.14);
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}

html, body{
  height:100%; margin:0; background:var(--bg); overflow:hidden;
  overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  font-family:var(--serif); color:var(--paper);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:focus-visible{ outline:1px solid rgba(255,211,154,.55); outline-offset:3px; }
canvas{ display:block; }
svg{ display:block; }
::selection{ background:rgba(255,211,154,.22); }

#app{ position:fixed; inset:0; overflow:hidden; isolation:isolate; background:#04070b; }

#scene{
  position:fixed; inset:0; width:100%; height:100%;
  touch-action:none; cursor:grab; background:radial-gradient(ellipse at 50% 45%, #08141b, #04070b 70%);
}
#scene.dragging{ cursor:grabbing; }

/* ───────── 画面调色层 ───────── */
.overlay{ position:fixed; inset:0; pointer-events:none; z-index:2; }
.grade{
  background:
    radial-gradient(ellipse 60% 52% at 68% 62%, rgba(255,160,82,.10), transparent 68%),
    radial-gradient(ellipse 46% 50% at 22% 38%, rgba(96,150,166,.08), transparent 70%),
    linear-gradient(180deg, rgba(3,8,12,.28) 0%, transparent 32%, transparent 72%, rgba(2,5,8,.46) 100%);
  mix-blend-mode:screen;
}
.vignette{
  background:radial-gradient(ellipse 76% 68% at 50% 52%, transparent 38%, rgba(1,4,7,.62) 100%);
}
.grain{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.55'/></svg>");
  opacity:.055; mix-blend-mode:overlay;
}

/* ───────── HUD 通用 ───────── */
#hud{ position:fixed; inset:0; z-index:10; pointer-events:none; opacity:0; transition:opacity 1.2s var(--ease); }
body.started #hud{ opacity:1; }

.brand{
  position:absolute; top:calc(18px + env(safe-area-inset-top)); left:calc(22px + env(safe-area-inset-left));
  display:flex; align-items:center; gap:12px; opacity:.92;
  text-shadow:0 2px 18px rgba(0,0,0,.5);
}
.brand .mark{ width:30px; height:30px; color:#dcc69f; filter:drop-shadow(0 0 10px rgba(255,206,150,.32)); flex:none; }
.brand .mark svg{ width:30px; height:30px; }
.brand .txt{ display:flex; flex-direction:column; gap:5px; }
.brand .t{ font-size:14.5px; letter-spacing:.4em; text-indent:.4em; color:#f0e5d0; }
.brand .sub{ font-family:Georgia,var(--serif); font-size:8.5px; letter-spacing:.24em; color:rgba(233,220,196,.42); text-transform:uppercase; }
.pouch{
  position:absolute; top:calc(76px + env(safe-area-inset-top)); left:calc(22px + env(safe-area-inset-left));
  display:flex; align-items:center; gap:11px; padding:7px 13px 7px 11px;
  border:1px solid rgba(214,190,155,.13); border-radius:30px;
  background:rgba(14,27,33,.72);
  color:rgba(233,220,196,.68); font-size:9.5px; letter-spacing:.1em;
  opacity:0; transform:translateY(-5px); transition:opacity .5s ease, transform .5s ease;
}
.pouch.show{ opacity:1; transform:none; }
.pouch .pitem{ display:flex; align-items:center; gap:5px; }
.pouch svg{ width:13px; height:13px; color:#d9b98a; }
.pouch b{ font-weight:500; color:#f0dfc2; font-size:10.5px; }
.pouch .psep{ width:1px; height:10px; background:rgba(214,190,155,.16); }
.pouch.bump{ animation:pouchBump .36s cubic-bezier(.2,.9,.3,1.4); }
@keyframes pouchBump{ 0%{transform:scale(1)} 38%{transform:scale(1.09)} 100%{transform:scale(1)} }

.toolbar{
  position:absolute; top:calc(16px + env(safe-area-inset-top)); right:calc(18px + env(safe-area-inset-right));
  display:flex; gap:9px; pointer-events:auto;
}
.icon-btn{
  position:relative; width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center; color:rgba(233,220,196,.74);
  border:1px solid rgba(233,220,196,.14);
  background:rgba(8,10,13,.55);
  transition:color .25s, border-color .25s, background .25s, transform .25s;
}
.icon-btn:hover{ color:#f5e9d2; border-color:rgba(255,211,154,.42); background:rgba(22,17,12,.5); }
.icon-btn:active{ transform:scale(.94); }
.icon-btn .ico{ width:19px; height:19px; }
.icon-btn .ico-mute{ display:none; }
body.is-muted .icon-btn .ico-sound{ display:none; }
body.is-muted .icon-btn .ico-mute{ display:block; }

.ico{ width:20px; height:20px; overflow:visible; }

/* ───────── 准星 / 交互提示 ───────── */
#reticle{
  position:absolute; left:50%; top:50%; width:26px; height:26px;
  transform:translate(-50%,-50%); display:grid; place-items:center;
  opacity:.55; transition:opacity .3s, transform .3s var(--ease);
}
#reticle::before{
  content:""; width:4px; height:4px; border-radius:50%;
  background:rgba(255,240,214,.92); box-shadow:0 0 8px rgba(255,210,150,.6);
}
#reticle::after{
  content:""; position:absolute; inset:2px; border-radius:50%;
  border:1px solid rgba(255,230,196,.28); transform:scale(.7); opacity:0;
  transition:transform .35s var(--ease), opacity .35s;
}
#reticle.active{ opacity:1; }
#reticle.active::after{ transform:scale(1); opacity:1; border-color:rgba(255,214,158,.7); }
#reticle.active::before{ box-shadow:0 0 14px rgba(255,196,110,.9); transform:scale(1.35); }

#prompt{
  position:absolute; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%,8px);
  display:flex; align-items:center; gap:9px; padding:10px 16px;
  border-radius:999px; border:1px solid rgba(255,220,170,.18);
  background:rgba(9,12,15,.8);
  box-shadow:0 12px 40px rgba(0,0,0,.35), inset 0 0 26px rgba(255,180,100,.04);
  font-size:12.5px; letter-spacing:.12em; color:rgba(244,233,212,.92);
  opacity:0; visibility:hidden; transition:opacity .3s var(--ease), transform .3s var(--ease), visibility .3s;
  max-width:86vw; white-space:nowrap;
}
#prompt.show{ opacity:1; visibility:visible; transform:translate(-50%,0); }
#prompt .ico{ width:13px; height:13px; color:rgba(255,214,158,.9); flex:none; }
#prompt kbd{
  font-family:Georgia,var(--serif); font-size:10px; letter-spacing:.06em;
  min-width:19px; height:19px; padding:0 5px; display:inline-grid; place-items:center;
  color:rgba(233,220,196,.72); border:1px solid rgba(233,220,196,.2);
  border-radius:4px; background:rgba(255,255,255,.04);
}
body.touch #prompt kbd{ display:none; }

#toast{
  position:absolute; left:50%; bottom:calc(158px + env(safe-area-inset-bottom));
  transform:translate(-50%,8px);
  max-width:min(84vw,520px); padding:11px 20px;
  border-radius:12px; border:1px solid rgba(255,220,170,.14);
  background:rgba(9,12,16,.9);
  font-size:12.5px; line-height:1.7; letter-spacing:.06em; text-align:center;
  color:rgba(240,229,208,.92);
  opacity:0; visibility:hidden; transition:opacity .45s var(--ease), transform .45s var(--ease), visibility .45s;
  pointer-events:none;
}
#toast.show{ opacity:1; visibility:visible; transform:translate(-50%,0); }

/* ───────── 操作提示 ───────── */
#controlsHint{
  position:absolute; left:calc(22px + env(safe-area-inset-left));
  bottom:calc(22px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  font-size:11px; letter-spacing:.14em; color:rgba(233,220,196,.5);
  padding:9px 14px; border:1px solid rgba(233,220,196,.09); border-radius:999px;
  background:rgba(6,9,12,.55);
  transition:opacity 1s var(--ease);
}
#controlsHint.fade{ opacity:0; }
#controlsHint .group{ display:flex; align-items:center; gap:5px; }
#controlsHint .ico{ width:13px; height:13px; color:rgba(255,211,154,.66); }
#controlsHint .key{
  display:inline-grid; place-items:center; min-width:19px; height:19px; padding:0 4px;
  border:1px solid rgba(233,220,196,.18); border-radius:4px;
  font-family:Georgia,var(--serif); font-size:9.5px; color:rgba(233,220,196,.72);
  background:rgba(255,255,255,.035);
}
#controlsHint .sep{ width:3px; height:3px; border-radius:50%; background:rgba(233,220,196,.24); }

/* ───────── 触屏操作 ───────── */
#joystick{
  position:absolute; left:calc(20px + env(safe-area-inset-left));
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:112px; height:112px; border-radius:50%;
  border:1px solid rgba(233,220,196,.14);
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.03), rgba(6,9,12,.4) 70%);
  pointer-events:auto; touch-action:none;
  opacity:0; visibility:hidden; transition:opacity .6s var(--ease), visibility .6s;
}
body.touch.started #joystick{ opacity:1; visibility:visible; }
#joystick .knob{
  position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px;
  border-radius:50%; border:1px solid rgba(255,220,170,.3);
  background:radial-gradient(circle at 40% 35%, rgba(255,236,206,.16), rgba(18,20,19,.5));
  box-shadow:0 4px 18px rgba(0,0,0,.35), inset 0 0 14px rgba(255,200,140,.06);
  transform:translate3d(0,0,0);
}
#joystick .hintring{
  position:absolute; inset:18px; border-radius:50%;
  border:1px dashed rgba(233,220,196,.09);
}
#interactBtn{
  position:absolute; right:calc(22px + env(safe-area-inset-right));
  bottom:calc(26px + env(safe-area-inset-bottom));
  width:76px; height:76px; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:rgba(255,228,190,.55);
  border:1px solid rgba(255,220,170,.16);
  background:radial-gradient(circle at 50% 40%, rgba(255,190,110,.08), rgba(8,10,12,.62));
  pointer-events:auto; touch-action:manipulation;
  opacity:0; visibility:hidden; transition:opacity .5s var(--ease), visibility .5s, color .3s, border-color .3s, transform .2s;
}
body.touch.started #interactBtn{ opacity:1; visibility:visible; }
#interactBtn .ico{ width:22px; height:22px; filter:drop-shadow(0 0 8px rgba(255,190,110,.35)); }
#interactBtn span{ font-size:9px; letter-spacing:.24em; text-indent:.24em; }
#interactBtn.ready{
  color:rgba(255,236,204,.98); border-color:rgba(255,214,158,.55);
  box-shadow:0 0 30px rgba(255,170,80,.18), inset 0 0 24px rgba(255,190,120,.08);
  animation:btnBreath 2.8s ease-in-out infinite;
}
@keyframes btnBreath{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.045); } }
#interactBtn:active{ transform:scale(.94); }

/* ───────── 载入 ───────── */
#loading{
  position:fixed; inset:0; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
  background:radial-gradient(ellipse at 50% 45%, #0b141a, #04070b 68%);
  transition:opacity 1.2s var(--ease), visibility 1.2s;
}
#loading.gone{ opacity:0; visibility:hidden; pointer-events:none; }
#loading .mark{ width:44px; height:44px; color:#e3cda5; animation:spinMoon 8s linear infinite; filter:drop-shadow(0 0 18px rgba(255,200,140,.3)); }
#loading .mark svg{ width:44px; height:44px; }
#loading p{ margin:0; font-size:11.5px; letter-spacing:.34em; text-indent:.34em; color:rgba(233,220,196,.46); }
#loading .bar{ width:120px; height:1px; background:rgba(233,220,196,.1); overflow:hidden; }
#loading .bar i{ display:block; width:44%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,211,154,.7), transparent); animation:loadSweep 1.8s ease-in-out infinite; }
@keyframes spinMoon{ to{ transform:rotate(360deg); } }
@keyframes loadSweep{ 0%{ transform:translateX(-120%); } 100%{ transform:translateX(320%); } }

/* ───────── 开场 ───────── */
#intro{
  position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:30px;
  background:
    radial-gradient(ellipse 58% 48% at 50% 45%, rgba(10,20,26,.42) 0%, rgba(6,11,15,.72) 52%, rgba(3,5,8,.9) 100%),
    linear-gradient(180deg, rgba(2,5,8,.45), rgba(2,5,8,.55));
  transition:opacity 1.8s var(--ease), visibility 1.8s;
  overflow:hidden;
}
#intro::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>");
  opacity:.045; mix-blend-mode:overlay;
}
#intro.gone{ opacity:0; visibility:hidden; pointer-events:none; }
.intro-inner{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; max-width:660px; }
.intro-mark{
  width:44px; height:44px; color:rgba(236,212,170,.82); margin-bottom:24px;
  filter:drop-shadow(0 0 22px rgba(255,206,150,.32));
  animation:markFloat 7s ease-in-out infinite;
}
.intro-mark svg{ width:44px; height:44px; }
@keyframes markFloat{ 0%,100%{ transform:translateY(0); opacity:.78; } 50%{ transform:translateY(-5px); opacity:1; } }
.intro-eyebrow{ font-size:9.5px; letter-spacing:.46em; text-indent:.46em; color:rgba(233,220,196,.44); margin-bottom:20px; }
.intro-title{
  margin:0; font-weight:400; font-size:clamp(38px, 8.6vw, 72px);
  letter-spacing:.24em; text-indent:.24em; line-height:1.15; color:#f3e9d6;
  text-shadow:0 0 60px rgba(255,190,110,.16), 0 2px 24px rgba(0,0,0,.4);
}
.intro-rule{
  width:min(280px,58vw); height:1px; margin:26px 0 22px; position:relative;
  background:linear-gradient(90deg, transparent, rgba(233,220,196,.28) 22%, rgba(255,211,154,.42) 50%, rgba(233,220,196,.28) 78%, transparent);
}
.intro-rule .diamond{
  position:absolute; left:50%; top:50%; width:5px; height:5px; transform:translate(-50%,-50%) rotate(45deg);
  background:rgba(255,214,158,.72); box-shadow:0 0 12px rgba(255,196,120,.5);
}
.intro-tagline{ font-size:13px; letter-spacing:.34em; text-indent:.34em; color:rgba(233,220,196,.68); margin:0 0 36px; }
.enter-btn{
  position:relative; display:inline-flex; align-items:center; gap:11px;
  padding:14px 30px 14px 26px; border-radius:999px;
  border:1px solid rgba(236,216,180,.26); color:#f0e4cd;
  letter-spacing:.3em; text-indent:.1em; font-size:13px;
  background:linear-gradient(180deg, rgba(255,214,160,.07), rgba(255,200,130,.015));
  overflow:hidden; pointer-events:auto;
  transition:border-color .5s, box-shadow .5s, transform .5s var(--ease), background .5s;
}
.enter-btn svg{ width:17px; height:17px; color:rgba(255,214,158,.9); }
.enter-btn::before{
  content:""; position:absolute; top:0; bottom:0; left:-60%; width:40%;
  background:linear-gradient(90deg, transparent, rgba(255,226,180,.14), transparent);
  transform:skewX(-18deg); transition:left .8s var(--ease);
}
.enter-btn:hover{ border-color:rgba(255,220,170,.6); box-shadow:0 0 38px rgba(255,170,80,.16), inset 0 0 30px rgba(255,190,110,.08); transform:translateY(-1px); }
.enter-btn:hover::before{ left:120%; }
.enter-btn:active{ transform:translateY(0) scale(.985); }
.intro-controls{ margin-top:30px; display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; }
.ctrl-item{ display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:.16em; color:rgba(233,220,196,.42); }
.ctrl-item .keys{ display:flex; gap:3px; }
.ctrl-item .key{
  display:inline-grid; place-items:center; width:20px; height:20px;
  border:1px solid rgba(233,220,196,.18); border-radius:4px;
  font-family:Georgia,var(--serif); font-size:9.5px; color:rgba(233,220,196,.66);
  background:rgba(255,255,255,.03);
}
.ctrl-item svg{ width:15px; height:15px; color:rgba(255,211,154,.6); }
.intro-note{ margin-top:24px; display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:.18em; color:rgba(233,220,196,.3); }
.intro-note svg{ width:12px; height:12px; color:rgba(233,220,196,.34); }
.intro-note .sep{ width:3px; height:3px; border-radius:50%; background:rgba(233,220,196,.24); }
.quiet-enter{
  margin-top:16px; padding:0 0 3px; font-size:9.5px; letter-spacing:.24em; text-indent:.24em;
  color:rgba(233,220,196,.34); border-bottom:1px solid rgba(233,220,196,.14);
  pointer-events:auto; transition:color .3s, border-color .3s;
}
.quiet-enter:hover{ color:rgba(233,220,196,.72); border-color:rgba(255,211,154,.35); }
.ctrl-touch{ display:none; }
body.touch .ctrl-desktop{ display:none; }
body.touch .ctrl-touch{ display:inline-flex; }

/* ───────── 手记 ───────── */
#bookModal{
  position:fixed; inset:0; z-index:65; display:grid; place-items:center;
  padding:max(20px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));
  background:rgba(2,4,7,.72); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
  opacity:0; visibility:hidden; transition:opacity .5s var(--ease), visibility .5s;
}
#bookModal.open{ opacity:1; visibility:visible; }
.book{
  position:relative; width:min(640px,94vw); max-height:86vh; padding:42px 46px 32px; overflow:auto; overscroll-behavior:contain;
  border-radius:4px 14px 14px 4px; border:1px solid rgba(214,184,137,.22);
  background:
    radial-gradient(120% 90% at 18% 0%, rgba(255,226,180,.07), transparent 55%),
    radial-gradient(90% 70% at 90% 100%, rgba(255,180,100,.04), transparent 60%),
    linear-gradient(158deg, #221a12 0%, #1b140d 52%, #141009 100%);
  box-shadow:0 34px 90px rgba(0,0,0,.66), inset 0 0 100px rgba(255,180,90,.035);
  transform:translateY(10px) scale(.985); opacity:0; transition:transform .55s var(--ease), opacity .55s var(--ease);
  scrollbar-width:thin; scrollbar-color:rgba(233,220,196,.2) transparent;
}
#bookModal.open .book{ transform:translateY(0) scale(1); opacity:1; }
.book::before{ content:""; position:absolute; inset:11px; pointer-events:none; border:1px solid rgba(214,184,137,.14); border-radius:2px 8px 8px 2px; }
.book::after{ content:""; position:absolute; left:0; top:0; bottom:0; width:7px; background:linear-gradient(90deg, rgba(0,0,0,.55), rgba(255,220,170,.05)); border-radius:4px 0 0 4px; }
.book-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:8px; padding-right:34px; }
.book-title-wrap{ display:flex; flex-direction:column; gap:8px; }
.book-eyebrow{ font-size:9px; letter-spacing:.36em; color:rgba(233,220,196,.36); }
.book-title{ font-size:25px; letter-spacing:.3em; text-indent:.3em; font-weight:400; margin:0; color:#f0e4cc; }
.book-rule{ height:1px; margin:20px 0 22px; background:linear-gradient(90deg, rgba(233,220,196,.24), rgba(233,220,196,.05)); }
.book-page{ min-height:220px; }
.book-page p{ margin:0 0 1.3em; font-size:15px; line-height:2.1; letter-spacing:.1em; color:rgba(238,227,207,.86); text-align:justify; }
.book-page p:last-child{ margin-bottom:0; }
.book-page .dropcap::first-letter{ float:left; font-size:44px; line-height:.9; padding:8px 10px 0 0; color:rgba(255,214,158,.78); }
.book-page.page-enter{ animation:pageIn .5s var(--ease); }
@keyframes pageIn{ from{ opacity:0; transform:translateX(8px); } to{ opacity:1; transform:none; } }
.book-foot{ display:flex; align-items:center; justify-content:space-between; gap:18px; margin-top:26px; padding-top:18px; border-top:1px solid rgba(233,220,196,.08); }
.book-pageno{ font-family:Georgia,var(--serif); font-size:10px; letter-spacing:.22em; color:rgba(233,220,196,.36); }
.book-nav{ display:flex; align-items:center; gap:8px; }
.book-nav .dots{ display:flex; gap:7px; margin:0 8px; }
.book-nav .dot{ width:4px; height:4px; border-radius:50%; background:rgba(233,220,196,.22); transition:background .4s, transform .4s; }
.book-nav .dot.on{ background:rgba(255,211,154,.8); transform:scale(1.35); }
.book-close{
  position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
  color:rgba(233,220,196,.5); border:1px solid rgba(233,220,196,.1); background:rgba(12,9,6,.3);
  transition:color .3s, border-color .3s, background .3s;
}
.book-close:hover{ color:#f3e8d2; border-color:rgba(255,211,154,.4); background:rgba(255,211,154,.06); }
.book-close svg{ width:16px; height:16px; }
.book-arrow{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:rgba(233,220,196,.55); border:1px solid rgba(233,220,196,.1); transition:color .3s, border-color .3s, background .3s, opacity .3s; }
.book-arrow:hover:not(:disabled){ color:#f3e8d2; border-color:rgba(255,211,154,.4); background:rgba(255,211,154,.05); }
.book-arrow:disabled{ opacity:.22; cursor:default; }
.book-arrow svg{ width:14px; height:14px; }

/* ───────── 响应式 ───────── */
@media (max-width:900px){
  body.touch #controlsHint{ display:none; }
  #prompt{ bottom:calc(122px + env(safe-area-inset-bottom)); font-size:11.5px; padding:9px 14px; }
  #toast{ bottom:calc(188px + env(safe-area-inset-bottom)); font-size:12px; }
}
@media (max-width:640px){
  .brand{ top:calc(13px + env(safe-area-inset-top)); left:calc(16px + env(safe-area-inset-left)); gap:10px; }
  .pouch{ top:calc(54px + env(safe-area-inset-top)); left:calc(16px + env(safe-area-inset-left)); padding:6px 11px 6px 9px; gap:9px; }
  .brand .mark, .brand .mark svg{ width:25px; height:25px; }
  .brand .t{ font-size:12.5px; letter-spacing:.32em; text-indent:.32em; }
  .brand .sub{ font-size:7px; letter-spacing:.18em; }
  .toolbar{ top:calc(11px + env(safe-area-inset-top)); right:calc(11px + env(safe-area-inset-right)); gap:7px; }
  .icon-btn{ width:37px; height:37px; }
  .intro-title{ font-size:clamp(34px, 10vw, 48px); letter-spacing:.18em; text-indent:.18em; }
  .intro-tagline{ font-size:11.5px; letter-spacing:.22em; text-indent:.22em; }
  .intro-controls{ gap:10px 16px; max-width:320px; }
  .intro-note{ font-size:9px; letter-spacing:.1em; gap:6px; flex-wrap:wrap; justify-content:center; }
  .book{ padding:34px 24px 26px; max-height:84vh; }
  .book::before{ inset:8px; }
  .book-title{ font-size:22px; letter-spacing:.24em; text-indent:.24em; }
  .book-page p{ font-size:13.5px; line-height:2; letter-spacing:.06em; }
  .book-page{ min-height:180px; }
  .book-foot{ margin-top:18px; padding-top:14px; }
  .book-close{ top:10px; right:10px; }
  #reticle{ opacity:.4; }
}
@media (max-height:480px) and (orientation:landscape){
  .intro-mark{ margin-bottom:12px; }
  .intro-rule{ margin:14px 0 12px; }
  .intro-tagline{ margin-bottom:18px; }
  .intro-note{ display:none; }
  .intro-controls{ margin-top:16px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ═══════════ 手写图标库 ═══════════ -->

  <!-- 画面调色 -->
  <div class="overlay grade"></div>
  <div class="overlay vignette"></div>
  <div class="overlay grain"></div>

  <!-- ═══════════ HUD ═══════════ -->

    <header class="brand">
      <span class="mark"><svg aria-hidden="true"><use href="#i-moon"/></svg></span>
      <span class="txt">
        <span class="t">林间小屋</span>
        <span class="sub">3D · A QUIET CABIN IN THE FOG</span>
      </span>
    </header>

    <div class="pouch" id="pouch" aria-live="polite">
      <span class="pitem"><svg aria-hidden="true"><use href="#i-mushroom"/></svg><b id="pouchMushroom">0</b></span>

      <span class="pitem"><svg aria-hidden="true"><use href="#i-cone"/></svg><b id="pouchCone">0</b></span>

      </button>

      <span>互动</span>

    <p>正在生起炉火</p>
    <div class="bar"><i></i></div>
  </div>

      <span class="intro-mark"><svg aria-hidden="true"><use href="#i-moon"/></svg></span>
      <div class="intro-eyebrow">雾林深处 · 第三十七夜</div>
      <h1 class="intro-title">林间小屋</h1>
      <div class="intro-rule"><span class="diamond"></span></div>
      <p class="intro-tagline">沿着石径走过去，门没有锁</p>
      <button class="enter-btn" id="startBtn">
        <svg aria-hidden="true"><use href="#i-enter"/></svg>
        进入雾林
      </button>
      <div class="intro-controls ctrl-desktop">
        <span class="ctrl-item">
          <span class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></span>
          <span>行走</span>
        </span>
        <span class="ctrl-item">
          <svg aria-hidden="true"><use href="#i-eye"/></svg>
          <span>拖动环视</span>
        </span>
        <span class="ctrl-item">
          <span class="key">E</span>
          <span>互动</span>
        </span>
      </div>
      <div class="intro-controls ctrl-touch">
        <span class="ctrl-item">
          <svg aria-hidden="true"><use href="#i-eye"/></svg>
          <span>拖动看四周</span>
        </span>
        <span class="ctrl-item">
          <svg aria-hidden="true"><use href="#i-spark"/></svg>
          <span>靠近微光轻触</span>
        </span>
      </div>
      <div class="intro-note">
        <svg aria-hidden="true"><use href="#i-sound"/></svg>
        <span>建议佩戴耳机</span><span class="sep"></span><span>夜晚请调高屏幕亮度</span>
      </div>
      <button class="quiet-enter" id="startMuted">静音进入</button>
    </div>
  </div>

  <!-- ═══════════ 手记 ═══════════ -->
  <div id="bookModal" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
    <article class="book">
      <button class="book-close" id="bookClose" aria-label="合上手记"><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>

          <h2 class="book-title" id="bookTitle">山居手记</h2>
        </div>
        <svg class="ico" aria-hidden="true" style="width:24px;height:24px;color:rgba(255,211,154,.45)"><use href="#i-book"/></svg>
      </div>
      <div class="book-rule"></div>
      <div class="book-page" id="bookPage"></div>
      <div class="book-foot">
        <span class="book-pageno" id="bookPageno"></span>
        <div class="book-nav">
          <button class="book-arrow" id="bookPrev" aria-label="上一页"><svg class="ico" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <div class="dots" id="bookDots"></div>
          <button class="book-arrow" id="bookNext" aria-label="下一页"><svg class="ico" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
        </div>
      </div>
    </article>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   林间小屋 · 3D
   第 1 部分：底座、程序化贴图、天空、地形、森林
   ═══════════════════════════════════════════════════════════════ */
(function () {
'use strict';

const T = THREE;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

const isTouch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;

const state = {
  started: false,
  running: false,
  bookOpen: false,
  muted: true,
  doorOpen: false,
  fire: true,
  lamp: true,
  windowOpen: false,
  lantern: true,
  pouch: { mushroom: 0, cone: 0 },
  foragePops: [],
  catAwake: false,
  music: false,
  target: null,
  nearDoor: 0,
  introTime: 0,
};

const quality = {
  dpr: isTouch ? 1.32 : 1.8,
  shadow: isTouch ? 768 : 1536,
  trees: isTouch ? 56 : 100,
  grass: isTouch ? 120 : 360,
  bushes: isTouch ? 52 : 90,
  ferns: isTouch ? 18 : 34,
  flowers: isTouch ? 28 : 52,
  mode: 'auto',
};

/* ───────────── 数学 / 随机 ───────────── */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261018);
const rand = (a, b) => (b === undefined ? a * rng() : a + (b - a) * rng());
const pick = (arr) => arr[Math.floor(rng() * arr.length) % arr.length];

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, oct) {
  let amp = .5, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < (oct || 4); i++) {
    sum += amp * vnoise(x * f, y * f);
    norm += amp;
    amp *= .5; f *= 2.03;
  }
  return sum / norm;
}

/* ───────────── 渲染底座 ───────────── */
let renderer, scene, camera, clock, maxAniso = 4;
let canvasEl = $('#scene');
const perfRefs = { pointClouds: [] };

scene = new T.Scene();
scene.background = new T.Color(0x04070b);
scene.fog = new T.FogExp2(0x0a1820, 0.019);

camera = new T.PerspectiveCamera(window.innerWidth / window.innerHeight < .8 ? 72 : 68, window.innerWidth / window.innerHeight, 0.05, 220);
camera.rotation.order = 'YXZ';

clock = new T.Clock();

/* ───────────── 贴图工厂 ───────────── */
function makeTex(w, h, draw, opts) {
  opts = opts || {};
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = opts.clamp ? T.ClampToEdgeWrapping : T.RepeatWrapping;
  t.repeat.set(opts.rx || 1, opts.ry || 1);
  t.anisotropy = maxAniso;
  t.encoding = opts.linear ? T.LinearEncoding : T.sRGBEncoding;
  if (opts.linearFilter) t.minFilter = T.LinearFilter;
  return t;
}

function grainOverlay(g, w, h, alpha, count) {
  g.save();
  for (let i = 0; i < (count || 2600); i++) {
    const v = rng();
    g.fillStyle = 'rgba(' + (v > .5 ? '255,235,205' : '0,0,0') + ',' + (rand(.015, .08) * (alpha || 1)).toFixed(3) + ')';
    const s = rand(.4, 1.7);
    g.fillRect(rand(0, w), rand(0, h), s, s);
  }
  g.restore();
}

/* 横向原木墙 */
const woodWallTex = makeTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#241a12'; g.fillRect(0, 0, w, h);
  const rows = 9, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    const y0 = r * rh;
    const base = 58 + rng() * 26;
    const gr = g.createLinearGradient(0, y0, 0, y0 + rh);
    gr.addColorStop(0, 'rgb(' + (base + 22 | 0) + ',' + (base * .66 | 0) + ',' + (base * .42 | 0) + ')');
    gr.addColorStop(.42, 'rgb(' + (base + 8 | 0) + ',' + (base * .58 | 0) + ',' + (base * .36 | 0) + ')');
    gr.addColorStop(1, 'rgb(' + (base - 22 | 0) + ',' + (base * .44 | 0) + ',' + (base * .28 | 0) + ')');
    g.fillStyle = gr; g.fillRect(0, y0, w, rh);
    // 木纹
    for (let i = 0; i < 46; i++) {
      const yy = y0 + rand(2, rh - 2);
      g.beginPath();
      g.moveTo(-10, yy);
      g.bezierCurveTo(w * .3, yy + rand(-4, 4), w * .7, yy + rand(-4, 4), w + 10, yy + rand(-3, 3));
      g.strokeStyle = rng() < .5 ? 'rgba(22,13,8,.18)' : 'rgba(196,152,104,.07)';
      g.lineWidth = rand(.6, 1.8);
      g.stroke();
    }
    // 节疤
    if (rng() < .55) {
      const kx = rand(60, w - 60), ky = y0 + rh * rand(.3, .7);
      const rg = g.createRadialGradient(kx, ky, 1, kx, ky, rand(8, 18));
      rg.addColorStop(0, 'rgba(26,15,8,.8)');
      rg.addColorStop(.55, 'rgba(52,32,18,.4)');
      rg.addColorStop(1, 'rgba(52,32,18,0)');
      g.fillStyle = rg;
      g.beginPath(); g.ellipse(kx, ky, rand(10, 20), rand(4, 8), rand(-.2, .2), 0, TAU); g.fill();
    }
    // 原木之间的缝隙与填缝
    g.fillStyle = 'rgba(10,7,4,.62)'; g.fillRect(0, y0 + rh - 3, w, 3);
    g.fillStyle = 'rgba(198,176,138,.16)'; g.fillRect(0, y0 + rh - 4.5, w, 1.2);
    g.fillStyle = 'rgba(8,6,3,.35)'; g.fillRect(0, y0, w, 1.4);
  }
  grainOverlay(g, w, h, .9, 3200);
}, { rx: .54, ry: .54 });

/* 地板 */
const woodFloorTex = makeTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#1c130c'; g.fillRect(0, 0, w, h);
  const cols = 8, cw = w / cols;
  for (let c = 0; c < cols; c++) {
    const x0 = c * cw;
    const base = 48 + rng() * 26;
    const gr = g.createLinearGradient(x0, 0, x0 + cw, 0);
    gr.addColorStop(0, 'rgb(' + (base - 10 | 0) + ',' + (base * .62 | 0) + ',' + (base * .38 | 0) + ')');
    gr.addColorStop(.5, 'rgb(' + (base + 14 | 0) + ',' + (base * .7 | 0) + ',' + (base * .44 | 0) + ')');
    gr.addColorStop(1, 'rgb(' + (base - 8 | 0) + ',' + (base * .6 | 0) + ',' + (base * .36 | 0) + ')');
    g.fillStyle = gr; g.fillRect(x0, 0, cw, h);
    for (let i = 0; i < 30; i++) {
      const xx = x0 + rand(3, cw - 3);
      g.beginPath();
      g.moveTo(xx, -10);
      g.bezierCurveTo(xx + rand(-5, 5), h * .35, xx + rand(-5, 5), h * .68, xx + rand(-4, 4), h + 10);
      g.strokeStyle = rng() < .5 ? 'rgba(20,12,7,.16)' : 'rgba(206,166,116,.055)';
      g.lineWidth = rand(.6, 1.5);
      g.stroke();
    }
    g.fillStyle = 'rgba(8,5,3,.55)'; g.fillRect(x0 + cw - 2, 0, 2, h);
    g.fillStyle = 'rgba(208,170,120,.07)'; g.fillRect(x0 + 1, 0, 1, h);
  }
  grainOverlay(g, w, h, .8, 2400);
}, { rx: 3, ry: 4 });

/* 石块 */
const stoneTex = makeTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#171512'; g.fillRect(0, 0, w, h);
  let y = 8;
  while (y < h) {
    const rh = rand(58, 96);
    let x = rand(-30, 4);
    while (x < w) {
      const bw = rand(74, 150);
      const v = rand(52, 88);
      const grd = g.createLinearGradient(x, y, x + bw, y + rh);
      grd.addColorStop(0, 'rgb(' + (v + 16 | 0) + ',' + (v + 10 | 0) + ',' + (v | 0) + ')');
      grd.addColorStop(.55, 'rgb(' + (v | 0) + ',' + (v - 4 | 0) + ',' + (v - 9 | 0) + ')');
      grd.addColorStop(1, 'rgb(' + (v - 22 | 0) + ',' + (v - 24 | 0) + ',' + (v - 27 | 0) + ')');
      g.fillStyle = grd;
      const rx = rand(3, 9);
      g.beginPath();
      g.moveTo(x + rx, y);
      g.lineTo(x + bw - rx, y + rand(0, 3));
      g.quadraticCurveTo(x + bw, y + rh * .2, x + bw - rand(0, 4), y + rh - rx);
      g.quadraticCurveTo(x + bw - 20, y + rh, x + bw * .6, y + rh - rand(0, 3));
      g.lineTo(x + rx, y + rh - rand(0, 3));
      g.quadraticCurveTo(x, y + rh * .7, x + rand(0, 3), y + rx);
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(226,212,186,.09)';
      g.fillRect(x + 8, y + 4, bw * .55, 1.4);
      g.fillStyle = 'rgba(0,0,0,.16)';
      g.fillRect(x + 6, y + rh - 5, bw - 12, 2);
      x += bw + rand(5, 12);
    }
    y += rh + rand(5, 10);
  }
  grainOverlay(g, w, h, 1, 3000);
}, { rx: 2, ry: 2 });

/* 屋顶木瓦 */
const shingleTex = makeTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#10191a'; g.fillRect(0, 0, w, h);
  const rows = 14, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    const y = r * rh;
    const off = (r % 2) * 42;
    for (let x = -84; x < w + 84; x += 84) {
      const v = 24 + rng() * 22;
      g.fillStyle = 'rgb(' + (v + 4 | 0) + ',' + (v + 9 | 0) + ',' + (v + 10 | 0) + ')';
      g.beginPath();
      g.moveTo(x + off + 2, y + 3);
      g.lineTo(x + off + 82, y + 2);
      g.lineTo(x + off + 80, y + rh * .86);
      g.quadraticCurveTo(x + off + 42, y + rh + 2, x + off + 4, y + rh * .84);
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(188,208,202,.055)';
      g.fillRect(x + off + 8, y + 6, 62, 1.2);
      g.fillStyle = 'rgba(0,0,0,.26)';
      g.fillRect(x + off + 3, y + rh * .86, 76, 2);
    }
  }
  // 苔藓
  for (let i = 0; i < 40; i++) {
    g.fillStyle = 'rgba(58,76,52,' + rand(.05, .18).toFixed(2) + ')';
    g.beginPath(); g.ellipse(rand(0, w), rand(0, h), rand(10, 50), rand(4, 16), rand(-.3, .3), 0, TAU); g.fill();
  }
  grainOverlay(g, w, h, .8, 2000);
}, { rx: 1, ry: 1 });

/* 树皮 */

  g.fillStyle = '#241a12'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) {
    const x = rand(0, w);
    g.beginPath();
    g.moveTo(x, -10);
    g.bezierCurveTo(x + rand(-12, 12), h * .3, x + rand(-14, 14), h * .7, x + rand(-8, 8), h + 10);
    const v = rand(28, 60);
    g.strokeStyle = 'rgba(' + (v | 0) + ',' + (v * .68 | 0) + ',' + (v * .46 | 0) + ',' + rand(.3, .8).toFixed(2) + ')';
    g.lineWidth = rand(1, 5);
    g.stroke();
  }
  for (let i = 0; i < 8; i++) {
    g.fillStyle = 'rgba(12,8,5,.35)';
    g.beginPath(); g.ellipse(rand(0, w), rand(0, h), rand(3, 9), rand(8, 26), 0, 0, TAU); g.fill();
  }
}, { rx: 1, ry: 3 });

/* 小径（中心泥土，两侧透明） */
const pathTex = makeTex(512, 1024, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  const grd = g.createLinearGradient(0, 0, w, 0);
  grd.addColorStop(0, 'rgba(44,36,26,0)');
  grd.addColorStop(.2, 'rgba(52,43,30,.72)');
  grd.addColorStop(.5, 'rgba(64,54,38,.9)');
  grd.addColorStop(.8, 'rgba(52,43,30,.72)');
  grd.addColorStop(1, 'rgba(44,36,26,0)');
  g.fillStyle = grd;
  g.beginPath();
  g.moveTo(w * .28, -20);
  g.bezierCurveTo(w * .2, h * .3, w * .3, h * .65, w * .18, h + 20);
  g.lineTo(w * .82, h + 20);
  g.bezierCurveTo(w * .7, h * .65, w * .8, h * .3, w * .72, -20);
  g.closePath(); g.fill();
  for (let i = 0; i < 900; i++) {
    const x = rand(w * .22, w * .78), y = rand(0, h);
    g.fillStyle = 'rgba(' + (60 + rng() * 60 | 0) + ',' + (54 + rng() * 40 | 0) + ',' + (38 + rng() * 26 | 0) + ',' + rand(.15, .5).toFixed(2) + ')';
    g.beginPath(); g.ellipse(x, y, rand(1, 5), rand(.7, 2.4), rand(0, TAU), 0, TAU); g.fill();
  }
}, { clamp: true });

/* 地毯 */
const rugTex = makeTex(1024, 768, (g, w, h) => {
  g.fillStyle = '#351b18'; g.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const rings = [
    [0.47, '#7a4030', 16],
    [0.42, '#3c4a38', 6],
    [0.38, '#a86e46', 3],
    [0.30, '#8a5236', 2],
    [0.16, '#b9885a', 3],
  ];
  rings.forEach((r) => {
    g.strokeStyle = r[1]; g.lineWidth = r[2];
    g.beginPath(); g.ellipse(cx, cy, w * r[0], h * r[0], 0, 0, TAU); g.stroke();
  });
  g.strokeStyle = 'rgba(210,170,120,.4)'; g.lineWidth = 2;
  g.setLineDash([10, 12]);
  g.beginPath(); g.ellipse(cx, cy, w * .36, h * .36, 0, 0, TAU); g.stroke();
  g.setLineDash([]);
  // 菱纹
  for (let i = 0; i < 34; i++) {
    const a = (i / 34) * TAU;
    const x = cx + Math.cos(a) * w * .43, y = cy + Math.sin(a) * h * .43;
    g.fillStyle = i % 3 ? 'rgba(180,120,70,.38)' : 'rgba(90,110,80,.4)';
    g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.fillRect(-6, -6, 12, 12); g.restore();
  }
  // 中央图案
  g.strokeStyle = 'rgba(200,150,98,.28)'; g.lineWidth = 2;
  for (let i = 1; i <= 4; i++) {
    g.beginPath(); g.ellipse(cx, cy, 34 * i, 24 * i, 0, 0, TAU); g.stroke();
  }
  // 织纹
  for (let y = 0; y < h; y += 3) {
    g.fillStyle = 'rgba(0,0,0,.07)'; g.fillRect(0, y, w, 1);
  }
  for (let x = 0; x < w; x += 3) {
    g.fillStyle = 'rgba(255,220,180,.028)'; g.fillRect(x, 0, 1, h);
  }
  // 流苏
  for (let x = 8; x < w; x += 14) {
    g.strokeStyle = 'rgba(170,132,88,.5)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + rand(-2, 2), -8); g.stroke();
    g.beginPath(); g.moveTo(x, h); g.lineTo(x + rand(-2, 2), h + 8); g.stroke();
  }
}, { clamp: true });

/* 格子被面 */
const quiltTex = makeTex(512, 512, (g, w, h) => {
  g.fillStyle = '#713a33'; g.fillRect(0, 0, w, h);
  for (let i = 0; i <= 8; i++) {
    g.fillStyle = 'rgba(220,190,150,.16)'; g.fillRect(0, i * h / 8, w, 7);
    g.fillRect(i * w / 8, 0, 7, h);
  }
  for (let i = 0; i <= 8; i++) {
    g.fillStyle = 'rgba(42,74,62,.4)'; g.fillRect(0, i * h / 8 + 18, w, 4);
    g.fillRect(i * w / 8 + 18, 0, 4, h);
  }
  for (let i = 0; i < 2200; i++) {
    g.fillStyle = 'rgba(' + (200 + rng() * 40 | 0) + ',' + (170 + rng() * 40 | 0) + ',' + (140 + rng() * 30 | 0) + ',.03)';
    g.fillRect(rand(0, w), rand(0, h), rand(1, 3), rand(1, 3));
  }
}, { rx: 2, ry: 2 });

/* 窗帘布 */
const curtainTex = makeTex(512, 1024, (g, w, h) => {
  g.fillStyle = '#33402f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 10; i++) {
    const x = i * w / 10;
    const gr = g.createLinearGradient(x, 0, x + w / 10, 0);
    gr.addColorStop(0, 'rgba(0,0,0,.24)');
    gr.addColorStop(.45, 'rgba(255,230,190,.055)');
    gr.addColorStop(1, 'rgba(0,0,0,.18)');
    g.fillStyle = gr; g.fillRect(x, 0, w / 10, h);
  }
  for (let i = 0; i < 1600; i++) {
    g.fillStyle = 'rgba(220,206,170,.035)';
    g.fillRect(rand(0, w), rand(0, h), 1, rand(1, 3));
  }
}, { rx: 1, ry: 1 });

/* 草叶遮罩 */
const grassTex = makeTex(128, 128, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  for (let i = 0; i < 9; i++) {
    const x = rand(w * .12, w * .88);
    const top = rand(6, 42);
    g.beginPath();
    g.moveTo(x, h);
    g.quadraticCurveTo(x + rand(-14, 14), h * .55, x + rand(-22, 22), top);
    g.strokeStyle = 'rgba(' + (54 + rng() * 32 | 0) + ',' + (74 + rng() * 38 | 0) + ',' + (44 + rng() * 24 | 0) + ',.95)';
    g.lineWidth = rand(1.6, 3.4);
    g.lineCap = 'round';
    g.stroke();
  }
}, { clamp: true });

/* 蕨叶遮罩 */
const fernTex = makeTex(256, 256, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  g.strokeStyle = 'rgba(58,80,52,.9)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(w * .5, h); g.quadraticCurveTo(w * .56, h * .5, w * .42, h * .12); g.stroke();
  for (let i = 0; i < 11; i++) {
    const t = i / 11;
    const x = w * .5 + (w * .04) * Math.sin(t * 3) - t * w * .06;
    const y = h - t * h * .82;
    const len = (1 - t) * w * .3 + 8;
    g.strokeStyle = 'rgba(' + (54 + rng() * 24 | 0) + ',' + (84 + rng() * 30 | 0) + ',' + (48 + rng() * 18 | 0) + ',.85)';
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - len * .6, y - 6, x - len, y - 18); g.stroke();
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + len * .6, y - 8, x + len, y - 20); g.stroke();
  }
}, { clamp: true });

/* 光点 */

  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,244,214,1)');
  gr.addColorStop(.16, 'rgba(255,222,150,.9)');
  gr.addColorStop(.42, 'rgba(255,180,90,.3)');
  gr.addColorStop(.75, 'rgba(255,150,60,.06)');
  gr.addColorStop(1, 'rgba(255,140,50,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}, { clamp: true, linearFilter: true });

const coolGlowTex = makeTex(256, 256, (g, w, h) => {

/* 星星 / 光斑 */
const sparkTex = makeTex(128, 128, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const halo = g.createRadialGradient(cx, cy, 0, cx, cy, w * .48);
  halo.addColorStop(0, 'rgba(255,240,200,.8)');
  halo.addColorStop(.3, 'rgba(255,220,150,.22)');
  halo.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = halo; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,250,230,.98)';
  g.beginPath();
  g.moveTo(cx, cy - h * .43);
  g.quadraticCurveTo(cx + w * .045, cy - h * .06, cx + w * .43, cy);
  g.quadraticCurveTo(cx + w * .045, cy + h * .06, cx, cy + h * .43);
  g.quadraticCurveTo(cx - w * .045, cy + h * .06, cx - w * .43, cy);
  g.quadraticCurveTo(cx - w * .045, cy - h * .06, cx, cy - h * .43);
  g.fill();
}, { clamp: true, linearFilter: true });

/* 火焰 */
const flameTex = makeTex(128, 256, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  const gr = g.createRadialGradient(w / 2, h * .78, 4, w / 2, h * .62, w * .58);
  gr.addColorStop(0, 'rgba(255,252,226,1)');
  gr.addColorStop(.18, 'rgba(255,232,158,.95)');
  gr.addColorStop(.45, 'rgba(255,170,70,.85)');
  gr.addColorStop(.72, 'rgba(255,110,30,.4)');
  gr.addColorStop(1, 'rgba(255,80,10,0)');
  g.fillStyle = gr;
  g.beginPath();
  g.moveTo(w * .5, h * .02);
  g.bezierCurveTo(w * .7, h * .28, w * .86, h * .46, w * .84, h * .7);
  g.bezierCurveTo(w * .82, h * .9, w * .66, h * .98, w * .5, h * .98);
  g.bezierCurveTo(w * .34, h * .98, w * .18, h * .9, w * .16, h * .7);
  g.bezierCurveTo(w * .14, h * .46, w * .3, h * .3, w * .5, h * .02);
  g.fill();
  // 内焰
  const gr2 = g.createRadialGradient(w / 2, h * .82, 2, w / 2, h * .76, w * .3);
  gr2.addColorStop(0, 'rgba(255,255,246,.98)');
  gr2.addColorStop(.5, 'rgba(255,240,190,.8)');
  gr2.addColorStop(1, 'rgba(255,220,150,0)');
  g.fillStyle = gr2;
  g.beginPath(); g.ellipse(w / 2, h * .82, w * .24, h * .2, 0, 0, TAU); g.fill();
}, { clamp: true, linearFilter: true });

/* 音符、爱心 */

  g.beginPath();

}, { clamp: true, linearFilter: true });

/* 月亮 */
const moonTex = makeTex(512, 512, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2, r = w * .46;
  const gr = g.createRadialGradient(cx - r * .3, cy - r * .35, r * .1, cx, cy, r);
  gr.addColorStop(0, '#f4f7ea');
  gr.addColorStop(.6, '#d8e4d6');
  gr.addColorStop(.92, '#aec4bd');
  gr.addColorStop(1, 'rgba(174,196,189,0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
  g.save();
  g.beginPath(); g.arc(cx, cy, r * .96, 0, TAU); g.clip();
  for (let i = 0; i < 14; i++) {
    g.fillStyle = 'rgba(140,160,152,' + rand(.05, .15).toFixed(2) + ')';
    g.beginPath(); g.ellipse(cx + rand(-r * .7, r * .7), cy + rand(-r * .7, r * .7), rand(4, 26), rand(4, 18), rand(0, TAU), 0, TAU); g.fill();
  }
  g.restore();

/* 通用几何工具 */
function mesh(geo, mat, x, y, z, parent) {
  const m = new T.Mesh(geo, mat);
  m.position.set(x || 0, y || 0, z || 0);
  if (parent) parent.add(m);
  return m;
}
function box(w, h, d, mat, x, y, z, parent) {
  return mesh(new T.BoxGeometry(w, h, d), mat, x, y, z, parent);
}
function cyl(rt, rb, h, seg, mat, x, y, z, parent) {
  return mesh(new T.CylinderGeometry(rt, rb, h, seg || 10), mat, x, y, z, parent);
}
function plane(w, h, mat) { return new T.Mesh(new T.PlaneGeometry(w, h), mat); }
function shadowAll(obj, cast, receive) {
  obj.traverse((o) => {
    if (o.isMesh) { o.castShadow = cast !== false; o.receiveShadow = receive !== false; }
  });
  return obj;
}
function mergeGeo(list) {
  let count = 0;
  const geos = list.map((g) => (g.index ? g.toNonIndexed() : g));
  geos.forEach((g) => { count += g.attributes.position.count; });
  const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3), uv = new Float32Array(count * 2);
  let o = 0;
  geos.forEach((g) => {
    const p = g.attributes.position.array, n = g.attributes.normal.array, u = g.attributes.uv.array;
    pos.set(p, o * 3); nor.set(n, o * 3); uv.set(u, o * 2);
    o += g.attributes.position.count;
  });
  const out = new T.BufferGeometry();
  out.setAttribute('position', new T.BufferAttribute(pos, 3));
  out.setAttribute('normal', new T.BufferAttribute(nor, 3));
  out.setAttribute('uv', new T.BufferAttribute(uv, 2));
  return out;
}

/* ───────────── 地形高度 ───────────── */
function terrainH(x, z) {
  const d = Math.hypot(x, z - 1.5);
  const flat = smoothstep(15, 32, d);
  const pathMask = smoothstep(3.4, 1.2, Math.abs(x)) * smoothstep(24, 4, z);
  let hh = (fbm(x * .055, z * .055, 4) - .5) * 2.3 + (fbm(x * .17, z * .17, 3) - .5) * .45;
  hh *= flat;
  hh *= (1 - .92 * pathMask);
  return hh;
}


/* 单次 draw call 的柔光点云（挂灯晕、微光标记、雾团） */
function makePointCloud(positions, texture, opts) {
  opts = opts || {};
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(new Float32Array(positions), 3));
  const mat = new T.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: opts.additive === false ? T.NormalBlending : T.AdditiveBlending,
    fog: false,
    uniforms: {
      uMap: { value: texture },
      uColor: { value: new T.Color(opts.color === undefined ? 0xffffff : opts.color) },
      uSize: { value: opts.size || .4 },
      uScale: { value: (window.innerHeight / 2) / Math.tan(camera.fov * Math.PI / 360) },
      uOpacity: { value: opts.opacity === undefined ? .6 : opts.opacity },
    },
    vertexShader: [
      'uniform float uSize; uniform float uScale;',
      'void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0);',
      ' gl_PointSize = uSize * uScale / max(0.5, -mv.z);',
      ' gl_Position = projectionMatrix * mv; }',
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D uMap; uniform vec3 uColor; uniform float uOpacity;',
      'void main(){ vec4 t = texture2D(uMap, gl_PointCoord);',
      ' if (t.a < 0.008) discard;',
      ' gl_FragColor = vec4(uColor * t.rgb, t.a * uOpacity); }',
    ].join('\n'),
  });
  const pts = new T.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  perfRefs.pointClouds.push(mat);
  return pts;
}

(function buildStars() {
  const n = isTouch ? 520 : 820;
  const pos = new Float32Array(n * 3), size = new Float32Array(n), phase = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const u = rng(), v = rng();
    const theta = u * TAU;
    const phi = Math.acos(lerp(.06, 1, v));
    const r = 84;
    const x = Math.sin(phi) * Math.cos(theta) * r;
    const y = Math.cos(phi) * r;
    const z = Math.sin(phi) * Math.sin(theta) * r;
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    size[i] = rand(.55, 2.4);
    phase[i] = rng();
  }
  const geo = new T.BufferGeometry();
  geo.setAttribute('position', new T.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new T.BufferAttribute(size, 1));
  geo.setAttribute('aPhase', new T.BufferAttribute(phase, 1));
  const mat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.AdditiveBlending, fog: false,
    uniforms: { uTime: { value: 0 }, uDpr: { value: quality.dpr } },
    vertexShader: [
      'attribute float aSize; attribute float aPhase;',
      'uniform float uTime; uniform float uDpr; varying float vTw;',
      'void main(){',
      ' vTw = 0.45 + 0.55*sin(uTime*0.55 + aPhase*6.283);',
      ' vec4 mv = modelViewMatrix*vec4(position,1.0);',
      ' gl_PointSize = aSize * uDpr * 1.7;',
      ' gl_Position = projectionMatrix*mv;',
      '}',
    ].join('\n'),
    fragmentShader: [
      'varying float vTw;',
      'void main(){',
      ' vec2 c = gl_PointCoord - 0.5; float d = length(c);',
      ' float a = smoothstep(0.5, 0.02, d) * (0.18 + 0.82*vTw);',
      ' gl_FragColor = vec4(vec3(0.78,0.88,0.92), a);',
      '}',
    ].join('\n'),
  });
  const stars = new T.Points(geo, mat);
  stars.frustumCulled = false;
  starGroup.add(stars);
  starGroup.userData.mat = mat;
  perfRefs.stars = stars;
  perfRefs.starFull = n;
})();

/* 一棵松树的两种几何：树皮与层层针叶 */
function makeTier(radius, h, seg, rr) {
  // 一片不规则的枝层：从梢顶向四周散开，边缘下垂并参差
  const pos = [];
  const apexY = h * .55;
  const rimY = -h * .45;
  const rim = [];
  for (let i = 0; i < seg; i++) {
    const a = (i / seg) * TAU + (rr() - .5) * .1;
    const k = .68 + rr() * .58;
    const drop = h * (.04 + rr() * .5);
    rim.push([Math.cos(a) * radius * k, rimY - drop, Math.sin(a) * radius * k]);
  }
  for (let i = 0; i < seg; i++) {
    const a = rim[i], b = rim[(i + 1) % seg];
    pos.push(0, apexY, 0, a[0], a[1], a[2], b[0], b[1], b[2]);
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  const n = pos.length / 3;
  g.setAttribute('uv', new T.BufferAttribute(new Float32Array(n * 2), 2));
  g.computeVertexNormals();
  return g;
}

function makePine(seed) {
  const rr = mulberry32(seed);
  const trunkGeo = new T.CylinderGeometry(.085, .24, 7.2, 7, 1);
  trunkGeo.translate(0, 3.6, 0);

  const layers = 14;
  const fol = [];
  for (let i = 0; i < layers; i++) {
    const t = i / (layers - 1);
    const y = 1.05 + t * 7.0;
    const radius = (2.45 - t * 2.24) * (0.78 + rr() * 0.4);
    const h = 1.2 - t * 0.36;
    const tier = makeTier(radius, h, 9, rr);
    tier.rotateY(rr() * TAU);
    tier.translate((rr() - .5) * .24, y, (rr() - .5) * .24);
    fol.push(tier);
  }
  const tip = new T.ConeGeometry(.17, 1.1, 6);
  tip.translate(0, 8.35, 0);
  fol.push(tip);
  return { trunk: trunkGeo, foliage: mergeGeo(fol) };
}

function wallShape(w, h, peak, holes) {
  const s = new T.Shape();
  s.moveTo(-w / 2, 0);
  s.lineTo(w / 2, 0);
  s.lineTo(w / 2, h);
  if (peak) { s.lineTo(0, peak); }
  s.lineTo(-w / 2, h);
  s.closePath();
  (holes || []).forEach((o) => {
    const p = new T.Path();
    p.moveTo(o.x, o.y);
    p.lineTo(o.x, o.y + o.h);
    p.lineTo(o.x + o.w, o.y + o.h);
    p.lineTo(o.x + o.w, o.y);
    p.closePath();
    s.holes.push(p);
  });
  return s;
}
function wallMesh(shape, mat, x, y, z, rotY) {

/* 屋顶几何 */
function roofGeo(sign, ceiling) {
  const yR = CAB.ridgeY - (ceiling ? .075 : 0);
  const yE = CAB.eaveY - (ceiling ? .075 : 0);
  const xE = CAB.eaveX * sign;
  const z0 = -3.5, z1 = 3.5;
  const A = [0, yR, z0], B = [0, yR, z1], C = [xE, yE, z1], D = [xE, yE, z0];
  const pos = [].concat(A, B, C, D);
  const uvs = [
    (z0 + 3.5) / 2.2, 0,
    (z1 + 3.5) / 2.2, 0,
    (z1 + 3.5) / 2.2, 2.2,
    (z0 + 3.5) / 2.2, 2.2,
  ];
  const idx = ceiling
    ? (sign > 0 ? [0, 2, 1, 0, 3, 2] : [0, 1, 2, 0, 2, 3])
    : (sign > 0 ? [0, 1, 2, 0, 2, 3] : [0, 2, 1, 0, 3, 2]);
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new T.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function curtainGeo(w, h) {
  const geo = new T.PlaneGeometry(w, h, 14, 4);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const t = (x + w / 2) / w;
    pos.setZ(i, Math.sin(t * Math.PI * 5) * .035 + Math.sin(t * Math.PI * 2) * .02);
  }
  geo.computeVertexNormals();
  return geo;
}

/* ═══════════════════════════════════════════════════════════════

const forageItems = [];

/* 蘑菇伞盖：暖褐底、浅色鳞斑 */
const mushroomCapTex = makeTex(256, 256, (g, w, h) => {
  const bg = g.createRadialGradient(w * .42, h * .35, 8, w * .5, h * .55, w * .72);
  bg.addColorStop(0, '#d9b489');
  bg.addColorStop(.55, '#c39a6d');
  bg.addColorStop(1, '#9c7450');
  g.fillStyle = bg;
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 46; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 2 + Math.random() * 7;
    g.fillStyle = 'rgba(246,236,214,' + (.18 + Math.random() * .4) + ')';
    g.beginPath();
    g.ellipse(x, y, r, r * .72, Math.random() * TAU, 0, TAU);
    g.fill();
  }
  for (let i = 0; i < 900; i++) {
    g.fillStyle = 'rgba(80,54,34,' + (Math.random() * .05) + ')';
    g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
  }
});
mushroomCapTex.encoding = T.sRGBEncoding;
mushroomCapTex.anisotropy = maxAniso;

/* 松果：鳞片纹理 */
const coneTex = makeTex(256, 256, (g, w, h) => {
  g.fillStyle = '#7a5a3c';
  g.fillRect(0, 0, w, h);
  const rows = 9, cols = 7;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = (c + (r % 2 ? .5 : 0)) * (w / cols) + w / (cols * 2);
      const y = r * (h / rows) + h / (rows * 2);
      const rr = w / cols * .52;
      const grd = g.createLinearGradient(x, y - rr, x, y + rr * .8);
      grd.addColorStop(0, '#a58158');
      grd.addColorStop(.55, '#8a6644');
      grd.addColorStop(1, '#5a4028');
      g.fillStyle = grd;
      g.beginPath();
      g.ellipse(x, y, rr, rr * .82, 0, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(48,32,20,.35)';
      g.lineWidth = 1.4;
      g.beginPath();
      g.arc(x, y + rr * .12, rr * .82, .15 * Math.PI, .85 * Math.PI);
      g.stroke();
    }
  }
  for (let i = 0; i < 1200; i++) {
    g.fillStyle = 'rgba(30,20,12,' + (Math.random() * .08) + ')';
    g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
  }
});
coneTex.encoding = T.sRGBEncoding;
coneTex.anisotropy = maxAniso;

const mushroomCapMat = new T.MeshStandardMaterial({
  map: mushroomCapTex, bumpMap: mushroomCapTex, bumpScale: .012,
  roughness: .82, metalness: 0,
});
const coneMat = new T.MeshStandardMaterial({
  map: coneTex, bumpMap: coneTex, bumpScale: .03,
  roughness: .95, metalness: 0,
});

function buildMushroomCluster(seed) {
  const rr = mulberry32(seed);
  const g = new T.Group();
  const n = 2 + Math.floor(rr() * 2);
  for (let i = 0; i < n; i++) {
    const ox = (rr() - .5) * .26, oz = (rr() - .5) * .26;
    const sc = .75 + rr() * .55;
    const st = new T.Mesh(new T.CylinderGeometry(.025, .042, .16, 6), M.cream);
    st.position.set(ox, .08 * sc, oz);
    st.scale.setScalar(sc);
    st.castShadow = true;
    st.receiveShadow = true;
    g.add(st);
    const cap = new T.Mesh(new T.SphereGeometry(.145, 12, 8), mushroomCapMat);
    cap.scale.set(sc, sc * .52, sc);
    cap.position.set(ox, .165 * sc, oz);
    cap.castShadow = true;
    cap.receiveShadow = true;
    g.add(cap);
  }
  return g;
}

function buildCone(tilt) {
  const g = new T.Group();
  const body = new T.Mesh(new T.SphereGeometry(.085, 9, 10), coneMat);
  body.scale.set(1, 1.45, 1);
  body.position.y = .12;
  body.castShadow = true;
  body.receiveShadow = true;
  body.rotation.z = tilt || 0;
  g.add(body);
  const stem = new T.Mesh(new T.CylinderGeometry(.012, .018, .06, 5), M.bark);
  stem.position.y = .26;
  stem.rotation.z = (tilt || 0) * .6;
  g.add(stem);
  return g;
}

function addForage(kind, x, z, opts) {
  opts = opts || {};
  const baseY = opts.y !== undefined ? opts.y : terrainH(x, z) + .015;
  const g = kind === 'mushroom' ? buildMushroomCluster(Math.floor(rand(1, 99999))) : buildCone(opts.tilt || 0);
  g.position.set(x, baseY, z);
  if (opts.scale) g.scale.setScalar(opts.scale);
  scene.add(g);
  mergeGroupLocal(g);
  markDynamic(g);
  const it = {
    id: 'forage',
    kind,

/* ───────── 静态几何合批：把同材质的静态网格并成一次 draw call ───────── */
function markDynamic(root) {
  if (!root) return root;
  root.traverse((o) => { o.userData.dynamic = true; });
  return root;
}
function batchStatic(root) {
  if (!root) return 0;
  const skip = new Set(occluders);
  const isSkipped = (o) => { let p = o; while (p) { if (skip.has(p)) return true; p = p.parent; } return false; };
  const groups = new Map();
  const removeList = [];
  root.updateWorldMatrix(true, true);
  root.traverse((o) => {
    if (!o.isMesh || o.isInstancedMesh || o.isSprite || o.isPoints) return;
    if (o.userData.dynamic || o.userData.noBatch) return;
    if (isSkipped(o)) return;
    if (Array.isArray(o.material)) return;
    const mat = o.material;
    if (!mat) return;
    if (mat.transparent && !o.userData.batchTransparent) return;
    if (!o.geometry.attributes.position || !o.geometry.attributes.normal || !o.geometry.attributes.uv) return;
    const key = mat.uuid;
    let g = groups.get(key);
    if (!g) { g = { mat, cast: false, receive: false, geos: [] }; groups.set(key, g); }
    g.cast = g.cast || o.castShadow;
    g.receive = g.receive || o.receiveShadow;
    const geo = o.geometry.clone();
    geo.applyMatrix4(o.matrixWorld);
    g.geos.push(geo);
    removeList.push(o);
  });
  removeList.forEach((o) => { if (o.parent) o.parent.remove(o); });
  let mergedCount = 0;
  groups.forEach((g) => {
    if (!g.geos.length) return;
    let merged;
    try { merged = mergeGeo(g.geos); } catch (err) { console.warn('batch merge failed', err); return; }
    const m = new T.Mesh(merged, g.mat);
    m.castShadow = g.cast;
    m.receiveShadow = g.receive;
    m.frustumCulled = false;
    if (g.mat.transparent) m.renderOrder = 2;
    scene.add(m);
    mergedCount++;
  });
  return mergedCount;
}


/* 动态组内部按材质合并（门板、猫、摇椅、窗扇、风铃） */
function mergeGroupLocal(group, excludeSet) {
  if (!group) return 0;
  group.updateWorldMatrix(true, true);
  const inv = new T.Matrix4().copy(group.matrixWorld).invert();
  const groups = new Map();
  const removeList = [];
  group.traverse((o) => {
    if (!o.isMesh || o.isInstancedMesh || o.isSprite || o.isPoints) return;
    if (Array.isArray(o.material) || !o.material) return;
    if (o.material.transparent) return;
    if (!o.geometry.attributes.position || !o.geometry.attributes.normal || !o.geometry.attributes.uv) return;
    if (excludeSet) {
      let p = o, skip = false;
      while (p && p !== group) { if (excludeSet.has(p)) { skip = true; break; } p = p.parent; }
      if (skip) return;
    }
    const m4 = new T.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    let g = groups.get(o.material.uuid);
    if (!g) { g = { mat: o.material, cast: false, receive: false, geos: [] }; groups.set(o.material.uuid, g); }
    g.cast = g.cast || o.castShadow;
    g.receive = g.receive || o.receiveShadow;
    const geo = o.geometry.clone();
    geo.applyMatrix4(m4);
    g.geos.push(geo);
    removeList.push(o);
  });
  removeList.forEach((o) => { if (o.parent) o.parent.remove(o); });
  let n = 0;
  groups.forEach((g) => {
    if (!g.geos.length) return;
    let merged;
    try { merged = mergeGeo(g.geos); } catch (e) { return; }
    const m = new T.Mesh(merged, g.mat);
    m.castShadow = g.cast;
    m.receiveShadow = g.receive;
    m.frustumCulled = false;
    group.add(m);
    n++;
  });
  return n;
}

const circleColliders = [];
treeColliders.forEach((t) => circleColliders.push({ x: t.x, z: t.z, r: t.r }));

circleColliders.push({ x: 4.9, z: 4.7, r: .5 });
circleColliders.push({ x: 2.72, z: 1.85, r: .38 });

const PLAYER_RADIUS = .33;
function resolveCollision(x, z) {
  for (let pass = 0; pass < 2; pass++) {
    const list = state.doorOpen ? boxColliders : boxColliders.concat([doorCollider]);
    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      const cx = clamp(x, c.minX, c.maxX);
      const cz = clamp(z, c.minZ, c.maxZ);
      let dx = x - cx, dz = z - cz;
      let d2 = dx * dx + dz * dz;
      if (d2 < PLAYER_RADIUS * PLAYER_RADIUS) {
        if (d2 > 1e-7) {
          const d = Math.sqrt(d2);
          x += dx / d * (PLAYER_RADIUS - d);
          z += dz / d * (PLAYER_RADIUS - d);
        } else {
          const dl = x - c.minX, dr = c.maxX - x, du = z - c.minZ, dd = c.maxZ - z;
          const m = Math.min(dl, dr, du, dd);
          if (m === dl) x = c.minX - PLAYER_RADIUS;
          else if (m === dr) x = c.maxX + PLAYER_RADIUS;
          else if (m === du) z = c.minZ - PLAYER_RADIUS;
          else z = c.maxZ + PLAYER_RADIUS;
        }
      }
    }
    for (let i = 0; i < circleColliders.length; i++) {
      const c = circleColliders[i];
      const dx = x - c.x, dz = z - c.z;
      const rr = c.r + PLAYER_RADIUS;
      const d2 = dx * dx + dz * dz;
      if (d2 < rr * rr && d2 > 1e-7) {
        const d = Math.sqrt(d2);
        x = c.x + dx / d * rr;
        z = c.z + dz / d * rr;
      }
    }
  }
  const bx = x, bz = z - 2;
  const bd = Math.hypot(bx, bz);
  if (bd > 30) {
    x = x * (30 / bd);
    z = 2 + (z - 2) * (30 / bd);
  }
  return [x, z];
}

let smokeClock = 0, emberClock = 0, steamClock = 0, noteClock = 0, heartClock = 0;

function updateParticles(dt, time) {
  // 炊烟
  smokeTimer -= dt;
  if (smokeTimer <= 0) {
    smokeTimer = state.fire ? rand(.45, .9) : rand(1.4, 2.6);
    spawnSmoke(time);
  }
  for (let i = 0; i < smokeParticles.length; i++) {
    const p = smokeParticles[i];
    if (!p.active) continue;
    p.life += dt;
    const t = p.life / p.max;
    p.s.position.x += (p.vx + Math.sin(p.life * .8 + i) * .12) * dt;
    p.s.position.y += p.vy * dt;
    p.s.position.z += Math.sin(p.life * .5 + i) * .06 * dt;
    p.s.scale.setScalar(p.size * (1 + t * 2.4));
    p.s.material.opacity = Math.sin(Math.min(1, t * 4) * Math.PI * .5) * (1 - t) * .17;
    if (t >= 1) { p.active = false; p.s.visible = false; }
  }
  // 火星
  if (state.fire) {
    emberTimer -= dt;
    if (emberTimer <= 0) { emberTimer = rand(.35, 1.1); spawnEmber(); }
  }
  for (let i = 0; i < emberParticles.length; i++) {
    const p = emberParticles[i];
    if (!p.active) continue;
    p.life += dt;
    const t = p.life / p.max;
    p.s.position.x += (p.vx + Math.sin(p.life * 3 + p.ph) * .15) * dt;
    p.s.position.y += p.vy * dt;
    p.s.material.opacity = (1 - t) * .85;
    if (t >= 1) { p.active = false; p.s.visible = false; }
  }
  // 蒸汽
  if (time < steamUntil) {
    steamClock -= dt;
    if (steamClock <= 0) { steamClock = rand(.16, .32); spawnSteam(); }
  }
  for (let i = 0; i < steamParticles.length; i++) {
    const p = steamParticles[i];
    if (!p.active) continue;
    p.life += dt;
    const t = p.life / p.max;
    p.s.position.y += .16 * dt;
    p.s.position.x += Math.sin(p.life * 2 + i) * .04 * dt;
    p.s.scale.setScalar((.14 + t * .35));
    p.s.material.opacity = (1 - t) * .22;
    if (t >= 1) { p.active = false; p.s.visible = false; }
  }
  // 音符
  if (time < noteUntil) {
    noteClock -= dt;
    if (noteClock <= 0) { noteClock = rand(.35, .6); spawnNote(); }
  }
  for (let i = 0; i < noteParticles.length; i++) {
    const p = noteParticles[i];
    if (!p.active) continue;
    p.life += dt;
    const t = p.life / p.max;
    p.s.position.y += .32 * dt;
    p.s.position.x += (p.vx + Math.sin(p.life * 2 + i) * .1) * dt;
    p.s.material.opacity = Math.sin(Math.min(1, t * 3) * Math.PI * .5) * (1 - t) * .9;
    if (t >= 1) { p.active = false; p.s.visible = false; }
  }
  // 爱心
  if (time < heartUntil) {
    heartClock -= dt;
    if (heartClock <= 0) { heartClock = rand(.3, .55); spawnHeart(); }
  }
  for (let i = 0; i < heartParticles.length; i++) {
    const p = heartParticles[i];
    if (!p.active) continue;
    p.life += dt;
    const t = p.life / p.max;
    p.s.position.y += .3 * dt;
    p.s.position.x += Math.sin(p.life * 2 + i) * .05 * dt;
    p.s.material.opacity = (1 - t) * .8;
    if (t >= 1) { p.active = false; p.s.visible = false; }
  }
  // 采集星屑
  for (let i = 0; i < sparkleParticles.length; i++) {
    const p = sparkleParticles[i];
    if (!p.active) continue;
    p.life += dt;
    const t = p.life / p.max;
    p.vy -= .75 * dt;
    p.s.position.x += p.vx * dt;
    p.s.position.y += p.vy * dt;
    p.s.position.z += p.vz * dt;
    p.s.material.opacity = Math.max(0, (1 - t) * .95);
    if (t >= 1) { p.active = false; p.s.visible = false; }
  }
  // 微光标记统一呼吸
  if (markerMat) markerMat.uniforms.uOpacity.value = .58 + Math.sin(time * 1.75) * .16;
}

/* ───────── 炉火与灯的呼吸 ───────── */
function updateFire(dt, time) {
  const fire = world.fire;
  if (!fire) return;
  const on = state.fire;
  const fl = .82 + Math.sin(time * 8.3) * .08 + Math.sin(time * 13.7 + 1.3) * .05 + Math.sin(time * 21.1) * .03;
  fire.light.intensity = on ? (1.15 + fl * .55) : .12;
  fire.glow.material.opacity = on ? (.38 + fl * .16) : .06;
  for (let i = 0; i < fire.sprites.length; i++) {
    const s = fire.sprites[i];
    const ph = s.userData.ph || 0;
    const base = s.userData.baseScale;
    if (on) {
      s.visible = true;
      const k = .8 + Math.sin(time * (5.5 + i * .4) + ph) * .16;
      s.scale.set((base || .3) * .72 * k, (base || .3) * 1.55 * k, 1);
      s.material.opacity = .75 + Math.sin(time * 9 + ph) * .2;
      s.position.y = .48 + (i % 4) * .07 + Math.sin(time * 3 + ph) * .02;
    } else {
      s.visible = false;
    }
  }
  // 灯
  const lamp = world.lamp;
  if (lamp) {
    const target = state.lamp ? 1 : 0;
    lamp.light.intensity += (target * (0.92 + Math.sin(time * 4.2) * .04) - lamp.light.intensity) * Math.min(1, dt * 6);
    lamp.glow.material.opacity += (target * .5 - lamp.glow.material.opacity) * Math.min(1, dt * 5);
    lamp.flame.visible = state.lamp;
    lamp.flame.scale.set(.09 + Math.sin(time * 6.1) * .012, .24 + Math.sin(time * 8.3) * .03, 1);
  }
  // 门缝暖光 / 门廊灯
  if (world.lanternGlow) {
    world.lanternGlow.material.opacity = state.lantern ? (.5 + Math.sin(time * 3.1) * .05) : 0;
  }
  if (world.lights.porch) {
    world.lights.porch.intensity = state.lantern ? (.8 + Math.sin(time * 2.3) * .05) : 0;
  }
  if (world.lanternGlass) {
    world.lanternGlass.emissiveIntensity = state.lantern ? 1.35 : .05;
  }
  // 窗光随炉火微动
  if (world.windowGlows) {
    world.windowGlows.forEach((g, i) => {
      g.material.opacity = .24 + (state.fire ? .1 : 0) + Math.sin(time * 2 + i) * .02;
    });
  }
}
  const Sound = {
    ctx: null, master: null, wet: null, comp: null,
    noiseBuf: null, audible: false, initialized: false,
    buses: {}, timers: [],
    fireGain: 0, fireTimer: null, cricketGain: 0,

    init() {
      if (this.initialized) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC({ latencyHint: 0.06 });
      } catch (e) {
        try { this.ctx = new AC(); } catch (e2) { return; }
      }
      this.initialized = true;
      const ctx = this.ctx;

      this.comp = ctx.createDynamicsCompressor();
      this.comp.threshold.value = -20;
      this.comp.knee.value = 24;
      this.comp.ratio.value = 3;
      this.comp.attack.value = 0.01;
      this.comp.release.value = 0.3;
      this.master = ctx.createGain();
      this.master.gain.value = 0;
      this.master.connect(this.comp);
      this.comp.connect(ctx.destination);

      // 简易混响
      const conv = ctx.createConvolver();
      conv.buffer = this.makeImpulse(2.4, 2.6);
      this.wet = ctx.createGain();
      this.wet.gain.value = 0.32;
      this.wet.connect(conv);
      conv.connect(this.master);

      this.noiseBuf = this.makeNoise(4);

      // 风
      const windGain = ctx.createGain();
      windGain.gain.value = 0.075;
      this.windGain = windGain;
      const windLP = ctx.createBiquadFilter();
      windLP.type = 'lowpass';
      windLP.frequency.value = 300;
      windLP.Q.value = 0.65;
      const wind = ctx.createBufferSource();
      wind.buffer = this.noiseBuf;
      wind.loop = true;
      wind.connect(windLP).connect(windGain).connect(this.master);
      wind.start();

      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.061;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.038;
      lfo.connect(lfoGain).connect(windGain.gain);
      lfo.start();

      const lfo2 = ctx.createOscillator();
      lfo2.frequency.value = 0.043;
      const lfo2Gain = ctx.createGain();
      lfo2Gain.gain.value = 130;
      lfo2.connect(lfo2Gain).connect(windLP.frequency);
      lfo2.start();

      // 树叶细声
      const leafBP = ctx.createBiquadFilter();
      leafBP.type = 'bandpass';
      leafBP.frequency.value = 1650;
      leafBP.Q.value = 0.6;
      const leafGain = ctx.createGain();
      leafGain.gain.value = 0.02;
      this.leafGain = leafGain;
      const leaf = ctx.createBufferSource();
      leaf.buffer = this.noiseBuf;
      leaf.loop = true;
      leaf.connect(leafBP).connect(leafGain).connect(this.master);
      leaf.start();
      const lfo3 = ctx.createOscillator();
      lfo3.frequency.value = 0.083;
      const lfo3Gain = ctx.createGain();
      lfo3Gain.gain.value = 0.013;
      lfo3.connect(lfo3Gain).connect(leafGain.gain);
      lfo3.start();

      const fireGain = ctx.createGain();
      fireGain.gain.value = 0;

      fireBP.type = 'bandpass';
      fireBP.frequency.value = 720;
      fireBP.Q.value = 0.55;
      const fire = ctx.createBufferSource();
      fire.buffer = this.noiseBuf;
      fire.loop = true;
      fire.connect(fireBP).connect(fireGain).connect(this.master);
      fire.start();
      this.fireGain = fireGain;
      const fireLfo = ctx.createOscillator();
      fireLfo.frequency.value = 1.7;
      const fireLfoGain = ctx.createGain();
      fireLfoGain.gain.value = 0.012;

    },

    makeNoise(sec) {
      const ctx = this.ctx;
      const len = Math.floor(ctx.sampleRate * sec);
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        let last = 0;
        for (let i = 0; i < len; i++) {
          const white = Math.random() * 2 - 1;
          last = (last + 0.035 * white) / 1.035;
          d[i] = last * 3.2 + white * 0.12;
        }
      }
      return buf;
    },

    makeImpulse(dur, decay) {
      const ctx = this.ctx;
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    },

    start() {
      this.init();
      if (!this.ctx) return;
      if (this.ctx.state === 'suspended') this.ctx.resume();
      this.audible = true;
      this.setVolume(true);
    },
    stop() {
      this.audible = false;
      this.setVolume(false);
    },
    setVolume(on) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setTargetAtTime(on ? 0.78 : 0, t, 0.25);
    },
    ensure() {
      if (!this.initialized) this.init();
      if (!this.ctx) return false;
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return true;
    },
    now() { return this.ctx ? this.ctx.currentTime : 0; },

    setFire(on) {
      if (!this.ctx || !this.fireGain) return;
      const t = this.now();
      this.fireGain.gain.cancelScheduledValues(t);
      this.fireGain.gain.setTargetAtTime(on ? 0.085 : 0, t, 0.7);
    },

    setScene(mode) {
      if (!this.ctx || !this.windGain) return;
      const t = this.now();
      const inside = mode === 'interior';
      this.windGain.gain.setTargetAtTime(inside ? 0.05 : 0.075, t, 1.2);
      if (this.leafGain) this.leafGain.gain.setTargetAtTime(inside ? 0.007 : 0.02, t, 1.2);
    },

    scheduleCrickets() {
      if (!this.ctx) return;
      const loop = () => {
        if (this.audible) this.cricket();
        this.cricketTimer = setTimeout(loop, 1800 + Math.random() * 4200);
      };
      this.cricketTimer = setTimeout(loop, 1400 + Math.random() * 2000);
    },

    cricket() {
      if (!this.ctx || this.ctx.state !== 'running') return;
      const ctx = this.ctx;
      const t0 = ctx.currentTime + 0.02;
      const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (pan) pan.pan.value = Math.random() * 1.4 - 0.7;
      const g = ctx.createGain();
      g.gain.value = 0;
      if (pan) { g.connect(pan); pan.connect(this.master); } else g.connect(this.master);
      const freqs = [4200 + Math.random() * 900, 4650 + Math.random() * 900];
      const pulses = 3 + (Math.random() * 3 | 0);
      for (let p = 0; p < pulses; p++) {
        const t = t0 + p * 0.075;
        freqs.forEach((f, i) => {
          const o = ctx.createOscillator();
          o.type = 'sine';
          o.frequency.value = f;
          const og = ctx.createGain();
          og.gain.setValueAtTime(0, t);
          og.gain.linearRampToValueAtTime(0.011 - i * 0.003, t + 0.008);
          og.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
          o.connect(og).connect(g);
          o.start(t); o.stop(t + 0.08);

    makeFireCrackles() {

        if (this.audible && this.fireGain && this.fireGain.gain.value > 0.01) {

          const t = ctx.currentTime + 0.02;

          src.buffer = this.noiseBuf;
          src.playbackRate.value = 0.7 + Math.random() * 0.8;
          const hp = ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.value = 900 + Math.random() * 1600;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.02 + Math.random() * 0.03, t + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04 + Math.random() * 0.09);
          src.connect(hp).connect(g).connect(this.master);
          src.start(t, Math.random() * 3, 0.2);
        }
        this.crackleTimer = setTimeout(crackle, 90 + Math.random() * 420);

      this.crackleTimer = setTimeout(crackle, 700);

    tone(freq, t, dur, vol, type, opts) {
      if (!this.ctx) return;
      opts = opts || {};
      const ctx = this.ctx;
      const o = ctx.createOscillator();

      if (opts.detune) o.detune.value = opts.detune;

      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + (opts.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(this.master);
      if (opts.wet) {

        w.gain.value = opts.wet;
        g.connect(w).connect(this.wet);

      o.stop(t + dur + 0.05);

    bell(freq, t, vol, dur, dest) {

        this.tone(freq * p, t + i * 0.002, dur * (1 - i * 0.1), vol * amps[i], 'sine', {
          attack: 0.004, wet: 0.55,
        });
      });

    pluck(freq, t, vol) {
      this.tone(freq, t, 1.3, vol, 'triangle', { attack: 0.004, wet: 0.4 });
      this.tone(freq * 2, t, 0.7, vol * 0.16, 'sine', { attack: 0.003, wet: 0.3 });

    click() {

      this.tone(320, t, 0.1, 0.025, 'sine', { attack: 0.002 });

    paper() {
      if (!this.ctx) return;
      const ctx = this.ctx;
      const t = ctx.currentTime + 0.01;
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 2600;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.03, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      src.connect(hp).connect(g).connect(this.master);
      src.start(t, 0.2, 0.35);

    door() {

      this.tone(48, t + 0.55, 0.5, 0.07, 'sine', { attack: 0.01, slide: 36 });

      const s = ctx.createBufferSource();
      s.buffer = this.noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 480; bp.Q.value = 1.2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
      s.connect(bp).connect(g).connect(this.master);
      s.start(t, 0.5, 1);
    },

    windGust() {
      if (!this.ctx) return;
      const ctx = this.ctx;
      const t = ctx.currentTime + 0.02;
      const s = ctx.createBufferSource();
      s.buffer = this.noiseBuf;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 400;

      lp.frequency.linearRampToValueAtTime(1200, t + 1.2);
      lp.frequency.linearRampToValueAtTime(360, t + 2.8);

      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.09, t + 1.1);
      g.gain.linearRampToValueAtTime(0.0001, t + 3);

      s.start(t, 0.4, 3.2);

    chairCreak() {

      const t = this.now() + 0.02;
      const ctx = this.ctx;
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(74, t);
      o.frequency.linearRampToValueAtTime(96, t + 0.4);
      o.frequency.linearRampToValueAtTime(68, t + 0.9);

      lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 2;

      g.gain.linearRampToValueAtTime(0.02, t + 0.08);
      g.gain.linearRampToValueAtTime(0.008, t + 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(lp).connect(g).connect(this.master);

    purr() {

      const t = ctx.currentTime + 0.02;
      const dur = 3.2;
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = 27;

      lp.type = 'lowpass'; lp.frequency.value = 190; lp.Q.value = 4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.35);
