      lfoG.gain.value = 0.032;
      lfo.connect(lfoG).connect(g.gain);
      o.connect(lp).connect(g).connect(this.master);
      o.start(t); lfo.start(t);
      o.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1);
    },

    tea() {
      if (!this.ctx) return;
      const ctx = this.ctx;
      const t = ctx.currentTime + 0.02;
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(500, t);
      bp.frequency.linearRampToValueAtTime(1050, t + 0.5);
      bp.frequency.linearRampToValueAtTime(420, t + 1.5);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.06, t + 0.25);
      g.gain.linearRampToValueAtTime(0.0001, t + 1.6);
      src.connect(bp).connect(g).connect(this.master);
      src.start(t, 0.3, 1.7);
      this.bell(1480, t + 1.55, 0.025, 0.7);
    },

    chime() {
      if (!this.ctx) return;
      const t = this.now() + 0.03;
      const notes = [1760, 1975, 2349, 2637, 2960];
      const seq = [0, 2, 4, 1, 3];
      seq.forEach((n, i) => this.bell(notes[n], t + i * 0.14 + Math.random() * 0.05, 0.045, 2.4));
    },

    clockChime() {
      if (!this.ctx) return;
      const t = this.now() + 0.03;
      [523.25, 659.25, 783.99].forEach((f, i) => this.bell(f, t + i * 0.52, 0.05, 4.2));
      this.bell(1046.5, t + 1.56, 0.032, 3.4);
    },

    musicBox() {
      if (!this.ctx) return;
      const seq = [0, 3, 7, 10, 12, 10, 7, 3, 7, 12, 15, 12, 10, 7, 3, 0];
      const base = 440;
      const t0 = this.now() + 0.1;
      seq.forEach((n, i) => {
        this.pluck(base * Math.pow(2, n / 12), t0 + i * 0.36, 0.05 + (i % 4 === 0 ? 0.015 : 0));
      });
      return seq.length * 0.36;
    },

    fireIgnite() {
      if (!this.ctx) return;
      const ctx = this.ctx;
      const t = ctx.currentTime + 0.02;
      const s = ctx.createBufferSource();
      s.buffer = this.noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 1;
      bp.frequency.setValueAtTime(300, t);
      bp.frequency.linearRampToValueAtTime(1400, t + 0.5);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.08, t + 0.18);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      s.connect(bp).connect(g).connect(this.master);
      s.start(t, 0.2, 1);
    },

    footstep(surface) {
      if (!this.ctx || this.ctx.state !== 'running') return;
      const ctx = this.ctx;
      const t = ctx.currentTime + 0.01;
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      src.playbackRate.value = surface === 'wood' ? 1.15 : 0.75;
      const f = ctx.createBiquadFilter();
      f.type = surface === 'wood' ? 'bandpass' : 'lowpass';
      f.frequency.value = surface === 'wood' ? 520 : 320;
      f.Q.value = surface === 'wood' ? 1.2 : 0.6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(surface === 'wood' ? 0.035 : 0.028, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (surface === 'wood' ? 0.16 : 0.22));
      src.connect(f).connect(g).connect(this.master);
      src.start(t, Math.random() * 2, 0.25);
      this.tone(surface === 'wood' ? 118 : 82, t, 0.1, 0.018, 'sine', { attack: 0.004 });
    },

    forage(kind) {
      if (!this.audible) return;
      const t = this.now();
      const f = kind === 'mushroom' ? 523.25 : 659.25;
      this.tone(f, t, 0.2, 0.05, 'sine', { attack: 0.004, wet: 0.35 });
      this.tone(f * 1.5, t + 0.055, 0.24, 0.032, 'sine', { attack: 0.003, wet: 0.4 });
      this.tone(f * 2, t + 0.1, 0.3, 0.016, 'sine', { attack: 0.003, wet: 0.45 });
      this.tone(kind === 'mushroom' ? 196 : 246.94, t, 0.14, 0.03, 'triangle', { attack: 0.004 });
    },
  };

/* ───────── 地面高度 ───────── */
function groundHeightAt(x, z) {
  if (x > -3.92 && x < 3.92 && z > -2.92 && z < 2.92) return CAB.floorY;
  if (x > -4.25 && x < 4.25 && z >= 2.9 && z < 4.9) return .28;
  if (x > -1.9 && x < .65 && z >= 4.9 && z < 5.72) return lerp(.28, 0, clamp((z - 4.9) / .82, 0, 1));
  return terrainH(x, z);
}
function insideCabin() {
  return player.pos.x > -3.9 && player.pos.x < 3.9 && player.pos.z > -2.9 && player.pos.z < 2.9;
}
function onPorch() {
  return player.pos.x > -4.2 && player.pos.x < 4.2 && player.pos.z >= 2.9 && player.pos.z < 4.95;
}

/* ───────── 提示 / 准星 ───────── */
function toast(msg, ms) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 3600);
}

function getLabel(it) {
  const now = performance.now() / 1000;
  switch (it.id) {
    case 'fire': return state.fire ? '留下余烬' : '重新点燃炉火';
    case 'lamp': return state.lamp ? '吹熄油灯' : '点亮油灯';
    case 'window': return state.windowOpen ? '关上木窗' : '推开木窗';
    case 'door': {
      const inside = player.pos.z < 2.98;
      if (state.doorOpen) return '关上门';
      return inside ? '推门出去' : '推门进屋';
    }
    case 'music': return state.music ? '八音盒正在唱' : '上紧八音盒';
    case 'cat': return state.catUntil > now ? '它还在打呼噜' : '摸摸小猫';
    case 'book': return '翻开手记';
    case 'clock': return '听一听钟声';
    case 'chime': return '碰响风铃';
    case 'chair': return '摇一摇椅子';
    case 'tea': return '续一壶热茶';
    case 'lantern': return state.lantern ? '吹灭提灯' : '点亮提灯';
    case 'forage': return it.labelOn || '采集';
    default: return it.labelOn || '互动';
  }
}

function setTarget(it) {
  if (it === currentTarget) {
    if (it && promptLabel && promptLabel.textContent !== getLabel(it)) promptLabel.textContent = getLabel(it);
    return;
  }
  currentTarget = it;
  if (it) {
    if (promptLabel) promptLabel.textContent = getLabel(it);
    if (promptEl) promptEl.classList.add('show');
    if (reticle) reticle.classList.add('active');
    if (interactBtn) interactBtn.classList.add('ready');
  } else {
    if (promptEl) promptEl.classList.remove('show');
    if (reticle) reticle.classList.remove('active');
    if (interactBtn) interactBtn.classList.remove('ready');
  }
}

function updateAim() {
  if (!state.started || state.bookOpen) { setTarget(null); return; }
  raycaster.setFromCamera(centerNDC, camera);
  raycaster.far = 4.6;
  const hits = raycaster.intersectObjects(hitMeshes, false);
  let found = null;
  if (hits.length) {
    const h = hits[0];
    const it = h.object.userData.interactable;
    if (it && !it.disabled && h.distance <= it.range) {
      const occ = raycaster.intersectObjects(occluders, true);
      if (!occ.length || occ[0].distance > h.distance - .03) found = it;
    }
  }
  setTarget(found);
}

/* ───────── 玩家 ───────── */
const camFwd = new T.Vector3();
const camRight = new T.Vector3();
function updatePlayer(dt, now) {
  if (!state.started || state.bookOpen) {
    player.vel.multiplyScalar(.82);
    if (state.started) {
      camera.position.set(player.pos.x, player.pos.y + player.eye + Math.sin(now * .9) * .004, player.pos.z);
      camera.rotation.set(player.pitch, player.yaw, 0);
      camera.updateMatrixWorld();
    }
    return;
  }
  let f = (keys.w ? 1 : 0) - (keys.s ? 1 : 0) + joy.y;
  let r = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joy.x;
  const l = Math.hypot(f, r);
  if (l > 1) { f /= l; r /= l; }
  const speed = keys.shift ? 3.45 : 2.2;
  camFwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  camRight.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const mx = (camFwd.x * f + camRight.x * r) * speed;
  const mz = (camFwd.z * f + camRight.z * r) * speed;
  const k = 1 - Math.exp(-dt * 11);
  player.vel.x += (mx - player.vel.x) * k;
  player.vel.z += (mz - player.vel.z) * k;

  const nx = player.pos.x + player.vel.x * dt;
  const nz = player.pos.z + player.vel.z * dt;
  const res = resolveCollision(nx, nz);
  player.pos.x = res[0];
  player.pos.z = res[1];

  const gh = groundHeightAt(player.pos.x, player.pos.z);
  player.y += (gh - player.y) * (1 - Math.exp(-dt * 9));
  player.pos.y = player.y;

  const spd = Math.hypot(player.vel.x, player.vel.z);
  if (spd > .32) {
    player.bobPhase += dt * spd * 4.4;
    player.bob = Math.sin(player.bobPhase) * .021 * clamp(spd / speed, 0, 1);
    player.stepDist += spd * dt;
    if (player.stepDist > .82) {
      player.stepDist = 0;
      Sound.footstep(insideCabin() || onPorch() ? 'wood' : 'ground');
    }
  } else {
    player.bob *= .9;
  }

  camera.position.set(player.pos.x, player.pos.y + player.eye + player.bob, player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
  camera.updateMatrixWorld();

  const inside = insideCabin();
  if (inside !== insideState) {
    insideState = inside;
    Sound.setScene(inside ? 'interior' : 'exterior');
    Sound.setFire(inside && state.fire);
    if (inside && !insideToastShown) {
      insideToastShown = true;
      toast('门里的暖意一下子裹了上来。', 3800);
    }
  }
  if (!doorHintShown && !inside && player.pos.z < 5.2 && Math.abs(player.pos.x + .7) < 2.4) {
    doorHintShown = true;
    toast('门没有锁。', 2600);
  }
}

/* ───────── 世界动态 ───────── */
function updateWorldAnimations(dt, now) {
  // 采集物缩小消失
  if (state.foragePops && state.foragePops.length) {
    for (let i = state.foragePops.length - 1; i >= 0; i--) {
      const p = state.foragePops[i];
      const k = (now - p.start) / .42;
      if (k >= 1) {
        p.it.group.visible = false;
        state.foragePops.splice(i, 1);
      } else {
        const sc = Math.max(.001, 1 - k);
        p.it.group.scale.setScalar(sc);
      }
    }
  }
  // 门
  if (world.doorPivot) {
    const target = state.doorOpen ? 1.92 : 0;
    world.doorPivot.rotation.y += (target - world.doorPivot.rotation.y) * Math.min(1, dt * 4.2);
  }
  // 窗扇
  interactables.forEach((it) => {
    if (it.id === 'window' && it.panes) {
      it.panes.forEach((p) => {
        if (!p.group) return;
        const target = state.windowOpen ? p.open : p.closed;
        p.group.rotation.y += (target - p.group.rotation.y) * Math.min(1, dt * 3.5);
      });
    }
  });
  // 窗帘
  if (world.curtains) {
    world.curtains.forEach((c, i) => {
      const target = state.windowOpen ? Math.sin(now * 1.6 + i) * .05 : 0;
      c.rotation.y += (target - c.rotation.y) * Math.min(1, dt * 2);
    });
  }
  // 摇椅
  if (world.chair) {
    if (now < state.chairUntil) {
      const tt = now - (state.chairStart || now);
      world.chair.rotation.x = Math.sin(tt * 2.5) * .055 * Math.min(1, (state.chairUntil - now) / .8);
    } else {
      world.chair.rotation.x *= .93;
    }
  }
  // 猫
  if (world.cat) {
    const awake = now < state.catUntil;
    world.cat.eyes.visible = awake;
    const targetRot = awake ? -.16 : .25;
    world.cat.head.rotation.x += (targetRot - world.cat.head.rotation.x) * Math.min(1, dt * 3);
    world.cat.group.scale.y = 1 + Math.sin(now * 1.35) * .011;
  }
  // 风铃
  if (world.chime) {
    if (now < state.chimeUntil) {
      world.chime.rotation.z = Math.sin(now * 9.5) * .2 * Math.min(1, (state.chimeUntil - now) / .8);
      world.chime.rotation.x = Math.sin(now * 6.2) * .05;
    } else {
      world.chime.rotation.z *= .93;
      world.chime.rotation.x *= .93;
    }
  }
  // 八音盒
  if (world.musicCrank && state.music) {
    world.musicCrank.rotation.x += dt * 5.5;
    if (now > state.musicUntil) state.music = false;
  }
  // 钟
  if (now - lastClockTick > 1) {
    lastClockTick = now;
    if (world.clock) {
      const d = new Date();
      const m = d.getMinutes() + d.getSeconds() / 60;
      const h = (d.getHours() % 12) + m / 60;
      world.clock.hour.rotation.x = -(h / 12) * TAU;
      world.clock.min.rotation.x = -(m / 60) * TAU;
    }
  }
  // 雾
  for (let i = 0; i < fogSprites.length; i++) {
    const f = fogSprites[i];
    if (f.flat) {
      f.s.position.x = f.baseX + Math.sin(now * f.sp + f.ph) * 1.1;
      f.s.position.z = f.baseZ + Math.cos(now * f.sp * .8 + f.ph) * 1.1;
      f.s.rotation.z += dt * .008;
    } else {
      f.s.position.x = f.baseX + Math.sin(now * f.sp + f.ph) * 2.4;
      f.s.position.z = f.baseZ + Math.cos(now * f.sp * .7 + f.ph) * 1.4;
    }
  }
  // shader 时间
  fireflyMat.uniforms.uTime.value = now;
  if (starGroup.userData.mat) starGroup.userData.mat.uniforms.uTime.value = now;
  if (world.dust) world.dust.uniforms.uTime.value = now;
  // 天空跟随
  skyGroup.position.copy(camera.position);
  starGroup.position.copy(camera.position);
  moonGroup.position.copy(camera.position).addScaledVector(moonDir, 85);
}

/* ───────── 输入 ───────── */
function initInput() {
  window.addEventListener('keydown', (e) => {
    if (!state.started) return;
    if (e.code === 'KeyW') keys.w = true;
    else if (e.code === 'KeyA') keys.a = true;
    else if (e.code === 'KeyS') keys.s = true;
    else if (e.code === 'KeyD') keys.d = true;
    else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;
    else if (e.code === 'KeyE' || e.code === 'Enter') { interact(); e.preventDefault(); }
    else if (e.code === 'Escape') { if (state.bookOpen) closeBook(); }
    if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyW') keys.w = false;
    else if (e.code === 'KeyA') keys.a = false;
    else if (e.code === 'KeyS') keys.s = false;
    else if (e.code === 'KeyD') keys.d = false;
    else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
  });
  window.addEventListener('blur', () => {
    keys.w = keys.a = keys.s = keys.d = keys.shift = false;
    joy.x = joy.y = 0;
    if (knobEl) knobEl.style.transform = 'translate3d(0,0,0)';
  });

  if (!canvasEl) return;
  canvasEl.addEventListener('pointerdown', (e) => {
    if (!state.started || state.bookOpen) return;
    if (e.button !== undefined && e.button !== 0) return;
    dragState = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false, pt: e.pointerType };
    canvasEl.classList.add('dragging');
    try { canvasEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  canvasEl.addEventListener('pointermove', (e) => {
    if (!dragState || dragState.id !== e.pointerId || !state.started || state.bookOpen) return;
    const dx = e.clientX - dragState.x;
    const dy = e.clientY - dragState.y;
    if (Math.abs(dx) + Math.abs(dy) > 5) dragState.moved = true;
    const sens = e.pointerType === 'touch' ? .0043 : .0031;
    player.yaw -= dx * sens;
    player.pitch = clamp(player.pitch - dy * sens * .92, -1.22, 1.22);
    dragState.x = e.clientX;
    dragState.y = e.clientY;
  });
  const endDrag = (e) => {
    if (!dragState || dragState.id !== e.pointerId) return;
    const moved = dragState.moved;
    dragState = null;
    canvasEl.classList.remove('dragging');
    if (!moved && state.started && !state.bookOpen) interact();
  };
  canvasEl.addEventListener('pointerup', endDrag);
  canvasEl.addEventListener('pointercancel', () => {
    dragState = null;
    canvasEl.classList.remove('dragging');
  });
  canvasEl.addEventListener('contextmenu', (e) => e.preventDefault());

  // 摇杆
  if (joystickEl && knobEl) {
    const setKnob = (x, y) => { knobEl.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)'; };
    let joyId = null;
    const joyStart = (e) => {
      if (!state.started || state.bookOpen) return;
      joyId = e.pointerId;
      joy.active = true;
      try { joystickEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      joyMove(e);
      e.preventDefault();
    };
    const joyMove = (e) => {
      if (joyId !== e.pointerId || !joy.active) return;
      const r = joystickEl.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = e.clientX - cx, dy = e.clientY - cy;
      const max = r.width * .34;
      const d = Math.hypot(dx, dy);
      if (d > max) { dx = dx / d * max; dy = dy / d * max; }
      setKnob(dx, dy);
      joy.x = dx / max;
      joy.y = -dy / max;
      if (Math.abs(joy.x) < .08) joy.x = 0;
      if (Math.abs(joy.y) < .08) joy.y = 0;
      e.preventDefault();
    };
    const joyEnd = (e) => {
      if (joyId !== e.pointerId) return;
      joyId = null;
      joy.active = false;
      joy.x = joy.y = 0;
      setKnob(0, 0);
      e.preventDefault();
    };
    joystickEl.addEventListener('pointerdown', joyStart);
    joystickEl.addEventListener('pointermove', joyMove);
    joystickEl.addEventListener('pointerup', joyEnd);
    joystickEl.addEventListener('pointercancel', joyEnd);
  }

  if (interactBtn) {
    interactBtn.addEventListener('click', (e) => {
      e.preventDefault();
      interact();
    });
  }
}

/* ───────── 手记 ───────── */
const BOOK_PAGES = [
  { text: ['雾从松针上落下来的时候，屋子就醒了。', '炉膛里剩一点火，像有人在黑暗里替我留着一句没说完的话。我添了一根柴，听见木头轻轻叹了口气。', '窗外的松林一直站着，不说话，也不催我。'] },

];
let bookPage = 0;
const bookModal = $('#bookModal');
const bookPageEl = $('#bookPage');
const bookPageno = $('#bookPageno');
const bookDots = $('#bookDots');
const bookPrev = $('#bookPrev');
const bookNext = $('#bookNext');

function renderBookPage() {
  if (!bookPageEl) return;
  const p = BOOK_PAGES[bookPage];
  bookPageEl.classList.remove('page-enter');
  void bookPageEl.offsetWidth;
  bookPageEl.innerHTML = p.text.map((t, i) => '<p' + (i === 0 ? ' class="dropcap"' : '') + '>' + t + '</p>').join('');
  bookPageEl.classList.add('page-enter');

  if (bookPageno) bookPageno.textContent = cn[bookPage] + ' / ' + cn[BOOK_PAGES.length - 1];
  if (bookDots) {
    Array.prototype.forEach.call(bookDots.children, (d, i) => d.classList.toggle('on', i === bookPage));
  }

  if (bookNext) bookNext.disabled = bookPage >= BOOK_PAGES.length - 1;
}
function openBook() {
  state.bookOpen = true;
  bookPage = 0;
  renderBookPage();
  bookModal.classList.add('open');
  Sound.paper();
  setTarget(null);
  setTimeout(() => Sound.paper(), 240);
}
function closeBook() {
  if (!state.bookOpen) return;
  state.bookOpen = false;
  bookModal.classList.remove('open');
  Sound.paper();
}
function initBookUI() {
  if (!bookDots) return;
  bookDots.innerHTML = BOOK_PAGES.map(() => '<span class="dot"></span>').join('');
  if (bookPrev) bookPrev.addEventListener('click', () => { if (bookPage > 0) { bookPage--; renderBookPage(); Sound.paper(); } });
  if (bookNext) bookNext.addEventListener('click', () => { if (bookPage < BOOK_PAGES.length - 1) { bookPage++; renderBookPage(); Sound.paper(); } });
  const bc = $('#bookClose');
  if (bc) bc.addEventListener('click', closeBook);
  if (bookModal) bookModal.addEventListener('click', (e) => { if (e.target === bookModal) closeBook(); });
}

/* ───────── 声音 / 全屏 / 重置 ───────── */
function toggleSound() {
  if (!Sound.ctx) {
    Sound.start();
    state.muted = false;
    document.body.classList.remove('is-muted');
    Sound.setScene(insideCabin() ? 'interior' : 'exterior');
    Sound.setFire(state.fire && insideCabin());
    toast('声音开了。');
    return;
  }
  if (state.muted) {
    state.muted = false;
    document.body.classList.remove('is-muted');
    Sound.start();
    Sound.setScene(insideCabin() ? 'interior' : 'exterior');
    Sound.setFire(state.fire && insideCabin());
    toast('声音开了。');
  } else {
    state.muted = true;
    document.body.classList.add('is-muted');
    Sound.stop();
    toast('已静音。');
  }
}
function toggleFullscreen() {
  const el = document.getElementById('app');
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => toast('这个浏览器不允许全屏。'));
    else toast('这个浏览器不支持全屏。');
  } else if (document.exitFullscreen) {
    document.exitFullscreen();
  }
}
function resetPlayer() {
  player.pos.set(0, 0, 15.8);
  player.y = 0;
  player.vel.set(0, 0, 0);
  player.yaw = 0;
  player.pitch = .03;
  dragState = null;
  setTarget(null);
  toast('回到小径尽头。屋里的灯还亮着。', 3000);
}

/* ───────── 开场 ───────── */
function startGame(silent) {
  if (state.started) return;
  state.started = true;
  startedAt = performance.now() / 1000;
  document.body.classList.add('started');
  introEl.classList.add('gone');
  if (silent) {
    state.muted = true;
    document.body.classList.add('is-muted');
  } else {
    state.muted = false;
    document.body.classList.remove('is-muted');
    Sound.start();
    Sound.setScene('exterior');
    Sound.setFire(false);
  }
  toast('沿着石径，走到那扇没有锁的门前。', 4200);
  clearTimeout(hintFadeTimer);
  hintFadeTimer = setTimeout(() => { if (controlsHint) controlsHint.classList.add('fade'); }, 18000);
}

/* ───────── 尺寸 ───────── */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.fov = (w / h < .8) ? 72 : 68;
  camera.updateProjectionMatrix();
  if (renderer) {
    const dpr = quality.dpr || (isTouch ? 1.32 : 1.8);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h);
    if (starGroup.userData.mat) starGroup.userData.mat.uniforms.uDpr.value = dpr;
    fireflyMat.uniforms.uDpr.value = dpr;
    if (world.dust) world.dust.uniforms.uDpr.value = dpr;
    updatePointScale();
  }
}

/* ───────── 主循环 ───────── */
let firstFrame = true;
function animate() {
  requestAnimationFrame(animate);
  if (document.hidden) return;
  if (state.bookOpen) { clock.getDelta(); return; }
  const dt = Math.min(.05, Math.max(.0001, clock.getDelta()));
  perfStats.acc += dt; perfStats.n++;
  if (perfStats.n >= 20) { perfStats.fps = perfStats.n / perfStats.acc; perfStats.acc = 0; perfStats.n = 0; }
  const now = performance.now() / 1000;
  if (!state.started) {
    state.introTime += dt;
    const t = state.introTime;
    camera.position.set(Math.sin(t * .045) * .35, 1.74 + Math.sin(t * .13) * .015, 16.0 + Math.sin(t * .07) * .18);
    camera.rotation.set(.035, Math.sin(t * .055) * .05, 0);
    updateParticles(dt, now);
    updateFire(dt, now);
    updateWorldAnimations(dt, now);
  } else {
    updatePlayer(dt, now);
    trackPerf(dt);
    aimFrame++;
    if (aimFrame % 3 === 0) updateAim();
    updateParticles(dt, now);
    updateFire(dt, now);
    updateWorldAnimations(dt, now);
  }
  if (renderer) renderer.render(scene, camera);
  if (firstFrame) {
    firstFrame = false;
    loadingEl.classList.add('gone');
  }
}

/* ───────── 画质 / 自适应性能 ───────── */
function updatePointScale() {
  const h = window.innerHeight * (quality.dpr || 1);
  const s = (h / 2) / Math.tan(camera.fov * Math.PI / 360);
  perfRefs.pointClouds.forEach((m) => { if (m.uniforms && m.uniforms.uScale) m.uniforms.uScale.value = s; });
}
const dprUniforms = [];
function setDpr(dpr) {
  quality.dpr = dpr;
  if (renderer) renderer.setPixelRatio(dpr);
  if (starGroup.userData.mat) starGroup.userData.mat.uniforms.uDpr.value = dpr;
  fireflyMat.uniforms.uDpr.value = dpr;
  if (world.dust) world.dust.uniforms.uDpr.value = dpr;
  updatePointScale();
}
function applyEffects(mode) {
  const smooth = mode === 'smooth';
  if (perfRefs.grass) perfRefs.grass.count = smooth ? Math.floor(perfRefs.grassFull * .5) : perfRefs.grassFull;
  if (perfRefs.bushes) perfRefs.bushes.inst.count = smooth ? Math.floor(perfRefs.bushes.full * .55) : perfRefs.bushes.full;
  if (perfRefs.ferns) perfRefs.ferns.inst.count = smooth ? Math.floor(perfRefs.ferns.full * .5) : perfRefs.ferns.full;
  if (perfRefs.flowers) perfRefs.flowers.inst.count = smooth ? Math.floor(perfRefs.flowers.full * .5) : perfRefs.flowers.full;
  if (perfRefs.fireflies) perfRefs.fireflies.geometry.setDrawRange(0, smooth ? Math.floor(perfRefs.fireflyFull * .6) : perfRefs.fireflyFull);
  if (perfRefs.stars) perfRefs.stars.geometry.setDrawRange(0, smooth ? Math.floor(perfRefs.starFull * .7) : perfRefs.starFull);
  if (perfRefs.fogPoints) perfRefs.fogPoints.visible = !smooth;
  for (let i = 0; i < fogSprites.length; i++) {
    const f = fogSprites[i];
    if (smooth) f.s.visible = !!(f.flat && i % 2 === 0);
    else f.s.visible = true;
  }
}
function baseDpr(mode) {
  if (mode === 'high') return Math.min(window.devicePixelRatio || 1, isTouch ? 1.7 : 2);
  if (mode === 'smooth') return 1.0;
  return isTouch ? 1.32 : 1.8;
}
function applyQuality(mode, silent) {
  quality.mode = mode;
  autoLow = false;
  setDpr(baseDpr(mode));
  applyEffects(mode);
  try { localStorage.setItem('cabin3d-quality', mode); } catch (e) { /* ignore */ }
  if (!silent) {
    const names = { auto: '自动', high: '高清', smooth: '流畅' };
    toast('画质：' + (names[mode] || mode), 2200);
  }
}
let perfAcc = 0, perfN = 0, perfWarm = 3.5, autoLow = false;
function trackPerf(dt) {
  if (!state.started || quality.mode !== 'auto') return;
  if (perfWarm > 0) { perfWarm -= dt; return; }
  perfAcc += dt; perfN++;
  if (perfN < 80) return;
  const avg = perfAcc / perfN;
  perfAcc = 0; perfN = 0;
  if (avg > 1 / 42) {
    if (quality.dpr > 1.01) {
      setDpr(Math.max(1.0, quality.dpr - .12));
    } else if (!autoLow) {
      autoLow = true;
      applyEffects('smooth');
      toast('已自动平衡画质，让火苗更轻盈。', 2600);
    }
  }
}
function cycleQuality() {
  const order = ['auto', 'high', 'smooth'];
  const i = order.indexOf(quality.mode);
  applyQuality(order[(i + 1) % 3]);
}
function initQualityUI() {
  let saved = 'auto';
  try { saved = localStorage.getItem('cabin3d-quality') || 'auto'; } catch (e) { /* ignore */ }
  if (['auto', 'high', 'smooth'].indexOf(saved) < 0) saved = 'auto';
  quality.mode = saved;
  const qb = $('#qualityBtn');
  if (qb) qb.addEventListener('click', cycleQuality);
}

/* ───────── 启动 ───────── */
function boot() {
  try {
    document.body.classList.toggle('touch', isTouch);
    document.body.classList.add('is-muted');
    initRenderer();
    // 动态物件内部先合并（整组一起动，合并安全）
    mergeGroupLocal(world.doorLeaf);
    mergeGroupLocal(world.chair);
    mergeGroupLocal(world.chime);
    mergeGroupLocal(world.musicCrank);
    if (world.cat) {
      mergeGroupLocal(world.cat.group, new Set([world.cat.head]));
      mergeGroupLocal(world.cat.head, new Set([world.cat.eyes]));
      mergeGroupLocal(world.cat.eyes);
    }
    interactables.forEach((it) => {
      if (it.panes) it.panes.forEach((p) => { if (p.group) mergeGroupLocal(p.group); });
    });
    // 静态道具合批，极大降低 draw call
    markDynamic(world.doorLeaf);
    markDynamic(world.cat.group);
    markDynamic(world.chair);
    markDynamic(world.chime);
    markDynamic(world.clock.hour);
    markDynamic(world.clock.min);
    markDynamic(world.musicCrank);
    if (world.curtains) world.curtains.forEach(markDynamic);
    interactables.forEach((it) => {
      if (it.panes) it.panes.forEach((p) => { if (p.group) markDynamic(p.group); });
    });
    if (window.__FORAGE_GROUPS__) window.__FORAGE_GROUPS__.forEach(markDynamic);
    window.__BATCH__ = {
      cabin: batchStatic(cabin),
      forest: batchStatic(forestGroup),
      props: batchStatic(staticProps),
    };
    scene.updateMatrixWorld(true);
    // 阴影是静态的：先渲染几帧，然后冻结 shadow map
    setTimeout(() => {
      if (renderer && renderer.shadowMap) {
        renderer.shadowMap.autoUpdate = false;
        renderer.shadowMap.needsUpdate = true;
      }
    }, 1600);
    initQualityUI();
    applyQuality(quality.mode, true);
    updatePointScale();
    initInput();
    initBookUI();
    updatePouch();
    const soundBtn = $('#soundBtn');
    if (soundBtn) soundBtn.addEventListener('click', toggleSound);
    const fsBtn = $('#fsBtn');
    if (fsBtn) fsBtn.addEventListener('click', toggleFullscreen);
    const resetBtn = $('#resetBtn');
    if (resetBtn) resetBtn.addEventListener('click', resetPlayer);
    const startBtn = $('#startBtn');
    if (startBtn) startBtn.addEventListener('click', () => startGame(false));
    const startMuted = $('#startMuted');
    if (startMuted) startMuted.addEventListener('click', () => startGame(true));
    if (canvasEl) canvasEl.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      toast('显卡上下文丢失了。请刷新页面，火会重新生起。', 6000);
    });
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 220));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (Sound.ctx) Sound.stop(); }
      else if (Sound.ctx && !state.muted) Sound.start();
    });
    // 初始相机
    camera.position.set(0, 1.74, 16.0);
    camera.rotation.set(.035, 0, 0);
    scene.updateMatrixWorld(true);
    camera.updateMatrixWorld(true);
    requestAnimationFrame(animate);
    if (/[?&]perf=1/.test(location.search)) {
      const ph = document.createElement('div');
      ph.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:90;padding:8px 10px;border-radius:8px;background:rgba(4,8,10,.78);border:1px solid rgba(255,220,170,.18);color:#e8d8b8;font:10px/1.6 ui-monospace,monospace;letter-spacing:.02em;white-space:pre;pointer-events:none';
      document.body.appendChild(ph);
      setInterval(() => {
        const info = renderer && renderer.info && renderer.info.render ? renderer.info.render : {};
        ph.textContent = 'FPS ' + perfStats.fps.toFixed(1) +
          '\ncalls ' + (info.calls || '-') + '  tris ' + (info.triangles || '-') +
          '\ndpr ' + quality.dpr.toFixed(2) + '  ' + quality.mode +
          '\naudio ' + (Sound.ctx ? Sound.ctx.state : 'off') +
          '\npos ' + player.pos.x.toFixed(1) + ',' + player.pos.z.toFixed(1);
      }, 500);
    }
    window.__CABIN3D__ = {
      scene, camera, renderer, state, player, world, interactables, markers,
      get target() { return currentTarget; }, interact, actions: doAction, resetPlayer,
    };
  } catch (err) {
    console.error('CABIN 3D boot failed:', err);
    if (loadingEl) {
      loadingEl.innerHTML = '<p style="max-width:80vw;line-height:2;letter-spacing:.1em;color:rgba(233,220,196,.7)">这间小屋没能点亮：<br>' + String(err && err.message || err) + '<br><br>请使用支持 WebGL 的浏览器，或试试 2D 画卷版本。</p>';
      loadingEl.classList.remove('gone');
    }
  }
}

boot();

})();
</script>
</body>
</html>
